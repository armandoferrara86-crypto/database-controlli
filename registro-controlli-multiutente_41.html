          <div style={{display:"flex",justifyContent:"flex-end",gap:10,paddingTop:16,borderTop:"1px solid var(--rim)"}}>
            <button onClick={onClose} style={{background:"none",border:"1px solid var(--rim)",color:"var(--text-2)",fontSize:14,padding:"8px 18px",borderRadius:7,cursor:"pointer"}}>Annulla</button>
            <button disabled={!rows||importing} onClick={handleImport} style={{
              background:rows&&!importing?"var(--accent)":"rgba(226,201,126,.12)",color:rows&&!importing?"#0c0e14":"var(--accent-dim)",
              fontSize:14,fontWeight:700,padding:"8px 22px",border:"none",borderRadius:7,cursor:rows?"pointer":"not-allowed"
            }}>
              {importing?`⏳ Importazione in corso…`:`⬆ Importa ${rows?rows.length:""} record nel database`}
            </button>
          </div>
        </> : (
          <div style={{textAlign:"center",padding:"32px 0"}}>
            <div style={{fontSize:52,marginBottom:16}}>🎉</div>
            <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:22,fontWeight:700,marginBottom:8}}>Importazione completata!</div>
            <div style={{fontSize:14,color:"var(--text-2)",marginBottom:24}}>Tutti i record sono stati caricati nel database condiviso.</div>
            <button onClick={onClose} style={{background:"var(--accent)",color:"#0c0e14",fontSize:14,fontWeight:700,padding:"10px 28px",border:"none",borderRadius:8,cursor:"pointer"}}>Vai al registro →</button>
          </div>
        )}
      </div>
    </Overlay>
  );
}

// ─── SETUP ────────────────────────────────────────────────────────────────────
function SetupScreen({onSave}){
  const [cfg,setCfg]=useState({apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""});
  const [raw,setRaw]=useState(""); const [error,setError]=useState("");
  const handlePaste=e=>{
    const text=e.target.value; setRaw(text); setError("");
    try{
      const parsed={};
      [["apiKey",/apiKey:\s*["'](.+?)["']/],["authDomain",/authDomain:\s*["'](.+?)["']/],["projectId",/projectId:\s*["'](.+?)["']/],["storageBucket",/storageBucket:\s*["'](.+?)["']/],["messagingSenderId",/messagingSenderId:\s*["'](.+?)["']/],["appId",/appId:\s*["'](.+?)["']/]]
        .forEach(([k,re])=>{ const m=text.match(re); if(m) parsed[k]=m[1]; });
      if(Object.keys(parsed).length>=3) setCfg(p=>({...p,...parsed}));
    }catch(_){}
  };
  const valid=Object.values(cfg).every(v=>v.trim().length>0);
  const handleSave=()=>{
    if(!valid){setError("Compila tutti i campi o incolla il blocco di configurazione."); return;}
    try{ firebase.app(); firebase.app().delete(); }catch(_){}
    try{ firebase.initializeApp(cfg); firebase.firestore(); localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); onSave(cfg); }
    catch(e){ setError("Configurazione non valida. Controlla i valori e riprova."); }
  };
  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 16px"}}>
      <div style={{width:"100%",maxWidth:560}}>
        <div style={{textAlign:"center",marginBottom:32}}><div style={{fontSize:48,marginBottom:12}}>🔥</div><div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:26,fontWeight:700}}>Configura il database</div><div style={{fontSize:14,color:"var(--text-2)",marginTop:6}}>Operazione da fare una sola volta.</div></div>
        <div style={{background:"rgba(10,14,22,0.82)",border:"0.5px solid rgba(255,255,255,0.14)",borderRadius:12,padding:22,marginBottom:14}}>
          <div style={{fontWeight:600,marginBottom:10}}>Incolla il blocco firebaseConfig copiato da Firebase</div>
          <p style={{fontSize:13,color:"var(--text-2)",lineHeight:1.7,marginBottom:10}}>Vai su <a href="https://console.firebase.google.com" target="_blank" style={{color:"var(--accent)"}}>console.firebase.google.com</a> → il tuo progetto → ⚙️ Impostazioni → sezione "Le tue app" → copia il blocco <code style={{background:"rgba(255,255,255,0.08)",padding:"1px 5px",borderRadius:4,color:"var(--accent)"}}>firebaseConfig</code>.</p>
          <textarea value={raw} onChange={handlePaste} placeholder={"Incolla qui il blocco firebaseConfig...\n\nconst firebaseConfig = {\n  apiKey: \"...\",\n  ...\n};"} style={{...INP,minHeight:130,resize:"vertical",fontFamily:"monospace",fontSize:12,lineHeight:1.7}}/>
          {Object.values(cfg).some(v=>v.length>0)&&<div style={{background:"rgba(82,183,136,.08)",border:"1px solid #52b78840",borderRadius:7,padding:"8px 12px",marginTop:8,fontSize:12,color:"var(--green)"}}>✅ Valori rilevati automaticamente!</div>}
        </div>
        {error&&<div style={{background:"rgba(224,82,82,.1)",border:"1px solid #e0525240",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#ff9090",marginBottom:12}}>{error}</div>}
        <button onClick={handleSave} style={{width:"100%",background:valid?"var(--accent)":"rgba(226,201,126,.12)",color:valid?"#0c0e14":"var(--accent-dim)",fontSize:15,fontWeight:700,padding:"12px",border:"none",borderRadius:9,cursor:valid?"pointer":"not-allowed"}}>🚀 Connetti il database e avvia l'app</button>
        <p style={{fontSize:11,color:"var(--text-2)",textAlign:"center",marginTop:10}}>La configurazione viene salvata nel browser.</p>
      </div>
    </div>
  );
}

function LogViewer({db, onClose}){
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterOp,setFilterOp]=useState("");
  const [filterAzione,setFilterAzione]=useState("");
  const [operatori,setOperatori]=useState([]);
  const [periodo,setPeriodo]=useState("7"); // giorni

  useEffect(()=>{
    const cut = new Date();
    cut.setDate(cut.getDate()-parseInt(periodo||7));
    const unsub = db.collection(COLL_LOG)
      .orderBy("timestamp","desc")
      .limit(500)
      .onSnapshot(snap=>{
        setLogs(snap.docs.map(d=>({id:d.id,...d.data()})));
        setLoading(false);
      });
    return ()=>unsub();
  },[periodo]);

  useEffect(()=>{
    db.collection(COLL_OPS).get().then(snap=>{
      setOperatori(snap.docs.map(d=>d.data().nome));
    });
  },[]);

  const filtered = logs.filter(l=>{
    const mOp = !filterOp || (l.operatore||"").toLowerCase().includes(filterOp.toLowerCase());
    const mAz = !filterAzione || l.azione===filterAzione;
    return mOp && mAz;
  });

  const fmtLog = ts => {
    if(!ts) return "—";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  };

  // Raggruppa per operatore per riepilogo
  const perOp = {};
  logs.forEach(l=>{ const k=l.operatore||"?"; perOp[k]=(perOp[k]||0)+1; });
  const topOp = Object.entries(perOp).sort(([,a],[,b])=>b-a);

  return (
    <Overlay onBgClick={onClose}>
      <div style={{background:"rgba(10,14,22,0.88)",border:"0.5px solid rgba(255,255,255,0.14)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",borderRadius:14,width:"100%",maxWidth:860,padding:28}}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
          <div>
            <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:22,fontWeight:700}}>📋 Log attività</div>
            <div style={{fontSize:12,color:"var(--text-2)",marginTop:3}}>Cronologia completa di tutte le azioni effettuate</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-2)",cursor:"pointer",fontSize:24,lineHeight:1}}>×</button>
        </div>

        {/* Riepilogo per operatore */}
        {topOp.length>0&&(
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
            {topOp.map(([nome,n])=>(
              <div key={nome} style={{background:"var(--bg)",border:"1px solid var(--rim)",borderRadius:8,padding:"8px 14px",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}
                onClick={()=>setFilterOp(filterOp===nome?"":nome)}>
                <Avatar name={nome} size={22}/>
                <span style={{fontSize:13,color:filterOp===nome?"#c9a84c":"#e8e6df"}}>{nome}</span>
                <span style={{background:"rgba(255,255,255,0.08)",color:"var(--accent)",fontSize:11,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{n}</span>
              </div>
            ))}
          </div>
        )}

        {/* Filtri */}
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <select value={periodo} onChange={e=>setPeriodo(e.target.value)}
            style={{...INP,width:"auto",cursor:"pointer",borderRadius:7,padding:"6px 10px",fontSize:12}}>
            <option value="1">Ultime 24 ore</option>
            <option value="7">Ultimi 7 giorni</option>
            <option value="30">Ultimi 30 giorni</option>
            <option value="90">Ultimi 90 giorni</option>
            <option value="3650">Tutto</option>
          </select>
          <input placeholder="Filtra per operatore…" value={filterOp} onChange={e=>setFilterOp(e.target.value)}
            style={{...INP,width:180,fontSize:12,padding:"6px 10px"}}/>
          <select value={filterAzione} onChange={e=>setFilterAzione(e.target.value)}
            style={{...INP,width:"auto",cursor:"pointer",borderRadius:7,padding:"6px 10px",fontSize:12}}>
            <option value="">Tutte le azioni</option>
            {Object.entries(AZIONI_LABEL).map(([k,v])=>(
              <option key={k} value={k}>{v.icon} {v.label}</option>
            ))}
          </select>
          <span style={{fontSize:12,color:"var(--text-2)",alignSelf:"center",marginLeft:4}}>
            {filtered.length} eventi
          </span>
        </div>

        {/* Tabella log */}
        <div style={{maxHeight:460,overflowY:"auto",border:"1px solid var(--rim)",borderRadius:8}}>
          {loading
            ?<div style={{textAlign:"center",padding:32,color:"var(--text-2)"}}>⏳ Caricamento…</div>
            :filtered.length===0
              ?<div style={{textAlign:"center",padding:32,color:"var(--text-2)"}}>Nessun evento trovato</div>
              :<table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead style={{position:"sticky",top:0,zIndex:1}}>
                  <tr style={{background:"var(--bg)",borderBottom:"1px solid var(--rim)"}}>
                    {["Data e ora","Operatore","Azione","Dettaglio"].map(h=>(
                      <th key={h} style={{fontSize:10,color:"var(--text-2)",letterSpacing:"0.07em",textTransform:"uppercase",padding:"8px 12px",textAlign:"left",fontWeight:500}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((l,i)=>{
                    const az = AZIONI_LABEL[l.azione]||{icon:"•",label:l.azione,color:"var(--text-2)"};
                    return (
                      <tr key={l.id} style={{borderBottom:"1px solid var(--rim)",background:i%2===0?"transparent":"#1a1e2a"}}>
                        <td style={{padding:"8px 12px",fontSize:11,color:"var(--text-2)",whiteSpace:"nowrap"}}>{fmtLog(l.timestamp)}</td>
                        <td style={{padding:"8px 12px"}}>
                          <div style={{display:"flex",alignItems:"center",gap:7}}>
                            <Avatar name={l.operatore||"?"} size={20}/>
                            <span style={{fontSize:12,color:"var(--text-1)"}}>{l.operatore||"—"}</span>
                            {l.matricola&&<span style={{fontSize:10,color:"var(--text-2)"}}>({l.matricola})</span>}
                          </div>
                        </td>
                        <td style={{padding:"8px 12px",whiteSpace:"nowrap"}}>
                          <span style={{background:az.color+"25",color:az.color,fontSize:11,padding:"2px 8px",borderRadius:999,fontWeight:600}}>
                            {az.icon} {az.label}
                          </span>
                        </td>
                        <td style={{padding:"8px 12px",fontSize:11,color:"var(--text-2)",maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {l.dettaglio||"—"}

        </div>

        <div style={{display:"flex",justifyContent:"flex-end",paddingTop:14,marginTop:14,borderTop:"1px solid var(--rim)"}}>

        </div>
      </div>
    </Overlay>
  );
}

function GestioneOperatoriModal({db, onClose}){
  const [operatori,setOperatori]=useState([]);
  const [loading,setLoading]=useState(true);
  const [nuovoNome,setNuovoNome]=useState("");
  const [nuovaMatricola,setNuovaMatricola]=useState("");
  const [saving,setSaving]=useState(false);
  const [errore,setErrore]=useState("");

  useEffect(()=>{
    const unsub = db.collection(COLL_OPS).orderBy("nome").onSnapshot(snap=>{
      setOperatori(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    });
    return ()=>unsub();
  },[]);

  const aggiungi = async () => {
    if(!nuovoNome.trim()) return;
    setSaving(true); setErrore("");
    try {
      const esiste = operatori.find(o=>o.nome.toLowerCase()===nuovoNome.trim().toLowerCase());
      if(esiste){ setErrore("Operatore già presente in lista."); setSaving(false); return; }
      await db.collection(COLL_OPS).add({nome:nuovoNome.trim(), matricola:nuovaMatricola.trim(), aggiuntoIl:firebase.firestore.FieldValue.serverTimestamp()});
      setNuovoNome(""); setNuovaMatricola("");
    } catch(e){ setErrore("Errore nel salvataggio."); }
    setSaving(false);
  };

  const rimuovi = async (id, nome) => {
    if(!window.confirm(`Rimuovere "${nome}" dalla lista degli autorizzati?`)) return;
    await db.collection(COLL_OPS).doc(id).delete();
  };

  return (
    <Overlay>
      <div style={{background:"rgba(10,14,22,0.88)",border:"0.5px solid rgba(255,255,255,0.14)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",borderRadius:14,width:"100%",maxWidth:560,padding:28}}>

          <div>
            <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:22,fontWeight:700}}>🔐 Operatori autorizzati</div>

          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-2)",cursor:"pointer",fontSize:24,lineHeight:1}}>×</button>
        </div>

        {!loading&&operatori.length===0&&(
          <div style={{background:"rgba(226,201,126,.08)",border:"1px solid #c9a84c40",borderRadius:8,padding:"10px 14px",fontSize:12,color:"var(--accent)",marginBottom:16,lineHeight:1.6}}>
            ⚠️ La lista è vuota — l'accesso è <b>aperto a tutti</b>. Aggiungi almeno un operatore per attivare il controllo accessi.
          </div>
        )}

        <div style={{maxHeight:300,overflowY:"auto",marginBottom:16}}>
          {loading
            ?<div style={{textAlign:"center",padding:20,color:"var(--text-2)",fontSize:13}}>⏳ Caricamento…</div>
            :operatori.length===0
              ?<div style={{textAlign:"center",padding:20,color:"var(--text-2)",fontSize:13}}>Nessun operatore aggiunto</div>
              :<table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr style={{borderBottom:"1px solid var(--rim)"}}>
                    <th style={{fontSize:10,color:"var(--text-2)",letterSpacing:"0.07em",textTransform:"uppercase",padding:"6px 10px",textAlign:"left",fontWeight:500}}>Nome e Cognome</th>
                    <th style={{fontSize:10,color:"var(--text-2)",letterSpacing:"0.07em",textTransform:"uppercase",padding:"6px 10px",textAlign:"left",fontWeight:500}}>Matricola</th>
                    <th style={{width:40}}></th>
                  </tr>
                </thead>
                <tbody>
                  {operatori.map(op=>(
                    <tr key={op.id} style={{borderBottom:"1px solid var(--rim)"}}>
                      <td style={{padding:"9px 10px",fontSize:14,fontWeight:600}}>{op.nome}</td>
                      <td style={{padding:"9px 10px",fontSize:13,color:"var(--text-2)"}}>{op.matricola||"—"}</td>
                      <td style={{padding:"9px 10px",textAlign:"center"}}>
                        <button onClick={()=>rimuovi(op.id,op.nome)}
                          style={{background:"none",border:"none",color:"var(--red)",cursor:"pointer",fontSize:16}} title="Rimuovi">🗑</button>
                      </td>

                  ))}
                </tbody>
              </table>
          }
        </div>

        <div style={{background:"var(--bg)",border:"1px solid var(--rim)",borderRadius:8,padding:14,marginBottom:14}}>
          <div style={{fontSize:11,color:"var(--accent)",letterSpacing:"0.07em",textTransform:"uppercase",fontWeight:600,marginBottom:10}}>+ Aggiungi operatore</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 140px auto",gap:8,alignItems:"center"}}>

        </div>
      </div>
    </Overlay>
  );

function LoginScreen({onLogin, db}){
  const [nome,setNome]=useState("");
  const [matricola,setMatricola]=useState("");
  const [checking,setChecking]=useState(false);
  const [errore,setErrore]=useState("");
  const valid=nome.trim().length>=2;

  const handleAccedi = async () => {
    if(!valid) return;
    setChecking(true); setErrore("");
    try {
      const snap = await db.collection(COLL_OPS).get();
      if(snap.empty) {
        // Nessun operatore in lista → accesso libero (primo avvio)
        onLogin(nome.trim(), matricola.trim());
        return;
      }
      const lista = snap.docs.map(d=>d.data());
      const nomeInput = nome.trim().toLowerCase();
      const matInput  = matricola.trim().toLowerCase();
      const trovato = lista.find(op => {
        const nomeOk = op.nome.toLowerCase() === nomeInput;
        // Se ha matricola in lista, deve corrispondere; se è vuota in lista, basta il nome
        const matOk  = !op.matricola || op.matricola.toLowerCase() === matInput;
        return nomeOk && matOk;
      });
      if(trovato) {
        onLogin(trovato.nome, trovato.matricola||matricola.trim());
      } else {
        setErrore("Accesso negato. Nome o matricola non autorizzati. Contatta l'amministratore.");
      }
    } catch(e) {
      setErrore("Errore di connessione. Riprova.");
    }
    setChecking(false);
  };

  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"rgba(255,255,255,0.06)",border:"0.5px solid rgba(255,255,255,0.14)",borderRadius:"var(--radius-lg)",padding:40,maxWidth:400,width:"100%",backdropFilter:"blur(32px) saturate(200%)",WebkitBackdropFilter:"blur(32px) saturate(200%)",boxShadow:"0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,0.18)",position:"relative",overflow:"hidden"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:44,marginBottom:14}}>🏛</div>
          <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:26,fontWeight:700,color:"var(--text-1)"}}>Registro Controlli</div>
          <div style={{fontSize:11,color:"var(--text-3)",marginTop:5,letterSpacing:"0.08em",textTransform:"uppercase"}}>Polizia Municipale · U.O. San Lorenzo</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <Field label="Nome e Cognome *">
            <input style={INP} placeholder="Es. Mario Rossi" value={nome}
              onChange={e=>{setNome(e.target.value);setErrore("");}}
              onKeyDown={e=>e.key==="Enter"&&valid&&handleAccedi()}/>
          </Field>
          <Field label="Matricola">
            <input style={INP} placeholder="Es. Isp. 1234" value={matricola}
              onChange={e=>{setMatricola(e.target.value);setErrore("");}}
              onKeyDown={e=>e.key==="Enter"&&valid&&handleAccedi()}/>
          </Field>
          {errore&&(
            <div style={{background:"rgba(224,82,82,.1)",borderRadius:"var(--radius-sm)",padding:"11px 14px",fontSize:13,color:"var(--red)",lineHeight:1.5,boxShadow:"0 0 0 1px rgba(224,82,82,.2)"}}>
              🔒 {errore}
            </div>
          )}
          <button disabled={!valid||checking} onClick={handleAccedi}
            className={valid&&!checking?"btn-primary":"btn-glass"}
            style={{marginTop:6,width:"100%",padding:"12px",fontSize:14,cursor:valid&&!checking?"pointer":"not-allowed",opacity:valid||checking?1:0.6}}>
            {checking?"⏳ Verifica in corso…":"Accedi →"}
          </button>
        </div>
        <p style={{fontSize:12,color:"var(--text-3)",textAlign:"center",marginTop:20}}>Accesso riservato al personale autorizzato.</p>
      </div>
    </div>
  );
}

function AddModal({onClose,onSave,initial,operatore,vocabolario=[],esercizi=[],recordEsistenti=[],canone=null,vocAgenti=[],vocTipo=[],vocMotivo=[]}){
  const [f,setF]=useState(()=>importoNelVerbale((()=>{ if(!initial) return {...EMPTY,anagrafica:{...ANAG_VUOTA}}; const provs = initial.provvedimenti?.length>0 ? initial.provvedimenti : (initial.provvedimento?[{tipo:initial.provvedimento,note:initial.note||"",importo:initial.importoSanzione||""}]:[{tipo:"",note:"",importo:""}]); return {...EMPTY,...initial,motivoControllo:initial.motivoControllo||[],violazioniRiscontrate:initial.violazioniRiscontrate||[],riferimenti:initial.riferimenti||[],titoliAutorizzativi:initial.titoliAutorizzativi||[],provvedimenti:provs,agentiOp:Array.isArray(initial.agentiOp)?initial.agentiOp:(initial.agentiOp?initial.agentiOp.split(",").map(s=>s.trim()).filter(Boolean):(initial._agenti?initial._agenti.split(",").map(s=>s.trim()).filter(Boolean):[])),ragioneSociale:initial.ragioneSociale||"",legaleRappresentante:initial.legaleRappresentante||initial.titolare||"",tipoAttivita:initial.tipoAttivita||"",anagrafica:{...ANAG_VUOTA,...(initial.anagrafica||{})}}; })()));

  // ── Anagrafica esercizi: autocompletamento ──
  const [apriAna,setApriAna]=useState(false);
  const qEs=(f.nomeEsercizio||"").trim().toLowerCase();
  const suggEs=React.useMemo(()=>{
    if(qEs.length<2) return [];
    return esercizi.filter(e=>e.nomeEsercizio.toLowerCase().includes(qEs)
      && e.nomeEsercizio.toLowerCase()!==qEs).slice(0,6);
  },[qEs,esercizi]);
  const applicaAnagrafica=es=>{
    setF(prev=>({...prev,
      nomeEsercizio:es.nomeEsercizio,
      indirizzo:            prev.indirizzo            || es.indirizzo            || "",
      ragioneSociale:       prev.ragioneSociale       || es.ragioneSociale       || "",
      legaleRappresentante: prev.legaleRappresentante || es.legaleRappresentante || "",

      titoliAutorizzativi:  (prev.titoliAutorizzativi&&prev.titoliAutorizzativi.length)?prev.titoliAutorizzativi:(es.titoliAutorizzativi||[]),
      identificativo:       prev.identificativo       || es.identificativo       || "",
      anagrafica: anagVuota(prev.anagrafica) && es.anagrafica ? {...ANAG_VUOTA,...es.anagrafica} : prev.anagrafica,
    }));
    setApriAna(false);
  };

  // ── Rilevamento duplicati: stesso esercizio + stessa data ──
  const duplicati=React.useMemo(()=>{
    const n=(f.nomeEsercizio||"").trim().toLowerCase();
    if(!n||!f.data) return [];
    return recordEsistenti.filter(r=>
      r.id!==initial?.id &&
      (r.nomeEsercizio||"").trim().toLowerCase()===n &&
      r.data===f.data);
  },[f.nomeEsercizio,f.data,recordEsistenti,initial]);

  const [saving,setSaving]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setA=(k,v)=>setF(p=>({...p,anagrafica:{...(p.anagrafica||ANAG_VUOTA),[k]:v}}));
  // nomi che l'utente ha voluto lasciare come li ha scritti (niente correzione automatica)
  const [tieni,setTieni]=useState(()=>new Set());
  const [notaInd,setNotaInd]=useState(null);
  // chiusura: niente clic a vuoto, e conferma se ci sono modifiche non salvate
  const fotoIniziale=useRef(null);
  if(fotoIniziale.current===null) fotoIniziale.current=JSON.stringify(f);
  const chiudi=()=>{ if(JSON.stringify(f)!==fotoIniziale.current && !window.confirm("Hai modifiche non salvate. Chiudere senza salvare?")) return; onClose(); };
  const normAgenti=React.useCallback(t=>normalizzaAgentiDigitati(t,canone),[canone]);
  const normMotivo=React.useMemo(()=>normalizzatoreVoce("motivo",canone),[canone]);

  const correggiTipo=React.useCallback(v=>canone?proponiValore("tipo",v,canone,1):null,[canone]);
  const haVerbale=(f.provvedimenti||[]).some(p=>eVerbale(p.tipo));
  const mancaVerbale=verbaleDaCompletare(sincronizzaProvvedimenti(f));
  const [apriAnag,setApriAnag]=useState(()=>!anagVuota(initial&&initial.anagrafica));
  const [pdfStato,setPdfStato]=useState(null);
  const filePdf=useRef(null);
  const avvisi=avvisiAnagrafica(f);
  const avvisoDi=k=>avvisi.find(a=>a.k===k);
  const fileJson=useRef(null);
  const caricaJson=async e=>{
    const file=e.target.files&&e.target.files[0]; e.target.value="";
    if(!file) return;
    setPdfStato({stato:"attesa",testo:"Lettura della scheda\u2026"});
    try{
      const testo=await file.text();
      const r=daJsonScheda(JSON.parse(testo));
      setF(p=>{
        const n={...p};
        for(const [k,v] of Object.entries(r.campi)){
          if(k==="anagrafica") continue;
          if(Array.isArray(v)){ if(v.length) n[k]=v; }
          else if(v) n[k]=v;
        }
        n.anagrafica={...(p.anagrafica||ANAG_VUOTA)};
        for(const [k,v] of Object.entries(r.campi.anagrafica||{})) if(v) n.anagrafica[k]=v;
        return canone ? pulisciRecord(n,canone) : n;
      });
      setApriAnag(true);
      setPdfStato({stato:"esatto",testo:r.note});
    }catch(err){ setPdfStato({stato:"errore",testo:"File non leggibile: "+(err.message||err)}); }
  };
  const caricaPdf=async e=>{
    const file=e.target.files&&e.target.files[0]; e.target.value="";
    if(!file) return;
    setPdfStato({stato:"attesa",testo:"Lettura del PDF\u2026"});
    try{
      const r=await leggiSchedaPdf(file);
      if(!r.campi){ setPdfStato({stato:"errore",testo:r.note}); return; }
      setF(p=>{
        const n={...p};
        for(const [k,v] of Object.entries(r.campi)){
          if(k==="anagrafica") continue;
          if(Array.isArray(v)){ if(v.length) n[k]=v; }
          else if(v) n[k]=v;
        }
        n.anagrafica={...(p.anagrafica||ANAG_VUOTA)};
        for(const [k,v] of Object.entries(r.campi.anagrafica||{})) if(v) n.anagrafica[k]=v;
        return canone ? pulisciRecord(n,canone) : n;
      });
      setApriAnag(true);
      setPdfStato({stato:r.esito==="esatto"?"esatto":"rivedere",testo:r.note});
    }catch(err){ setPdfStato({stato:"errore",testo:"Lettura non riuscita: "+(err.message||err)}); }
  };
  const cercaAnagrafe=()=>{
    if(!anagrafeDisponibile()) return;
    const sch=window.DB_BELLINI.get(f.nomeEsercizio);
    if(!sch){ setPdfStato({stato:"errore",testo:`\u00ab${f.nomeEsercizio}\u00bb non risulta in anagrafe. Il controllo si compila lo stesso.`}); return; }
    const d=daAnagrafe(sch);
    setF(p=>{
      const n={...p};
      for(const k of ["identificativo","nomeEsercizio","indirizzo","piva","ragioneSociale","legaleRappresentante"])
        if(d[k] && !String(p[k]||"").trim()) n[k]=d[k];
      n.anagrafica={...(p.anagrafica||ANAG_VUOTA)};
      for(const [k,v] of Object.entries(d.anagrafica)) if(v && !String(n.anagrafica[k]||"").trim()) n.anagrafica[k]=v;
      return n;
    });
    setApriAnag(true);
    setPdfStato({stato:"esatto",testo:`Dati dell\u2019anagrafe innestati per ${d.identificativo||f.nomeEsercizio}. Restano la fotografia alla data di oggi.`});
  };
  const valid=f.nomeEsercizio.trim()&&f.indirizzo.trim();
  const isEdit=!!initial;
  const handleSave=async()=>{ if(!valid) return; setSaving(true); await onSave(pulisciRecord(sincronizzaProvvedimenti({...f}),canone,tieni)); setSaving(false); };
  return (
    <Overlay>
      <div className="overlay-modal" style={{background:"rgba(10,14,22,0.88)",border:"0.5px solid rgba(255,255,255,0.14)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",borderRadius:14,width:"100%",maxWidth:660,padding:28}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
          <div><div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:22,fontWeight:700}}>{isEdit?"Modifica controllo":"Nuovo controllo"}</div><div style={{fontSize:12,color:"var(--text-2)",marginTop:3}}>Operatore: <b style={{color:"var(--accent)"}}>{operatore.nome}</b>{operatore.matricola?` · ${operatore.matricola}`:""}</div></div>
          <button onClick={chiudi} title="Chiudi" style={{background:"none",border:"none",color:"var(--text-2)",cursor:"pointer",fontSize:24,lineHeight:1}}>×</button>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:18,paddingBottom:16,borderBottom:"1px solid var(--rim)"}}>
          <input ref={fileJson} type="file" accept=".json,application/json" style={{display:"none"}} onChange={caricaJson}/>
          <button type="button" onClick={()=>fileJson.current&&fileJson.current.click()}
            style={{background:"rgba(82,214,138,.1)",border:"0.5px solid rgba(82,214,138,.3)",color:"var(--green)",fontSize:12,fontWeight:600,padding:"7px 14px",borderRadius:7,cursor:"pointer"}}>
            📥 Importa scheda (JSON)
          </button>
          <input ref={filePdf} type="file" accept="application/pdf" style={{display:"none"}} onChange={caricaPdf}/>
          <button type="button" onClick={()=>filePdf.current&&filePdf.current.click()}
            style={{background:"none",border:"1px dashed var(--rim)",color:"var(--text-2)",fontSize:12,padding:"7px 14px",borderRadius:7,cursor:"pointer"}}>
            📄 Compila da scheda d’ispezione (PDF)
          </button>
          {anagrafeDisponibile()&&(
            <button type="button" onClick={cercaAnagrafe} disabled={!f.nomeEsercizio.trim()}
              style={{background:"none",border:"1px dashed var(--rim)",color:f.nomeEsercizio.trim()?"var(--text-2)":"rgba(122,133,158,.4)",fontSize:12,padding:"7px 14px",borderRadius:7,cursor:f.nomeEsercizio.trim()?"pointer":"not-allowed"}}>
              🔎 Cerca in anagrafe
            </button>
          )}
          {pdfStato&&(
            <div style={{flex:"1 1 100%",fontSize:12,lineHeight:1.6,padding:"8px 12px",borderRadius:7,
              background:pdfStato.stato==="esatto"?"rgba(82,183,136,.10)":pdfStato.stato==="errore"?"rgba(224,82,82,.10)":"rgba(226,201,126,.10)",
              color:pdfStato.stato==="esatto"?"#52b788":pdfStato.stato==="errore"?"#e05252":"#c9a84c"}}>
              {pdfStato.testo}
            </div>
          )}
        </div>
        <SecTitle icon="📋" text="Dati esercizio"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
          {/* Tipo attività — menu principale */}
          <Field label="Tipo attività *" full>
            <select style={{...INP,cursor:"pointer",fontWeight:600}} value={f.tipoAttivita} onChange={e=>set("tipoAttivita",e.target.value)}>
              <option value="">— Seleziona tipo attività —</option>
              <option value="Attività Commerciale">🏪 Attività Commerciale</option>
              <option value="Attività Ricettiva Extralberghiera">🏠 Attività Ricettiva Extralberghiera</option>
            </select>
          </Field>
          <Field label="Data controllo">
            <input style={{...INP,colorScheme:"dark"}} type="date" value={f.data} onChange={e=>set("data",e.target.value)}/>
          </Field>
          <Field label="Agenti / Operatori" full>
            <TagInputSuggerito tags={f.agentiOp||[]} onChange={v=>set("agentiOp",v)} vocabolario={vocAgenti} virgola nomeCampo="Operanti"
              normalizza={normAgenti} onTieni={da=>setTieni(s=>new Set(s).add(chiaveTesto(da)))}
              titoloElenco="Operanti già presenti nelle schede"
              etichette={{noto:"Operante già presente nelle schede",libero:"Nome nuovo: controlla che sia scritto bene"}}
              placeholder="Cognome — scegli dall’elenco o scrivi e premi Invio"
              aiuto={<>Gradi (AC, ASS…), maiuscole, nomi attaccati e refusi evidenti si correggono da soli. <span style={{color:"var(--orange)"}}>✎</span> = nome mai usato prima.</>}/>
          </Field>
          {duplicati.length>0&&(
            <div style={{gridColumn:"1/-1",background:"rgba(247,176,122,.1)",border:"0.5px solid rgba(247,176,122,.32)",borderRadius:10,padding:"11px 14px",display:"flex",gap:11,alignItems:"flex-start"}}>
              <span style={{fontSize:17,lineHeight:1.2}}>⚠️</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:"var(--orange)"}}>
                  Possibile doppio inserimento
                </div>
                <div style={{fontSize:12,color:"var(--text-2)",marginTop:3,lineHeight:1.55}}>
                  Esiste già {duplicati.length===1?"un controllo":`${duplicati.length} controlli`} su <b style={{color:"var(--text-1)"}}>{f.nomeEsercizio}</b> in data <b style={{color:"var(--text-1)"}}>{fmt(f.data)}</b>
                  {duplicati[0].creatoDA&&<> — inserito da {duplicati[0].creatoDA}</>}.
                  Puoi comunque salvare se è un controllo diverso.
                </div>
              </div>
            </div>
          )}
          <Field label="Nome / Denominazione *" full>
            <div style={{position:"relative"}}>
              <input style={INP} placeholder="Es. Pasticceria Rossi" value={f.nomeEsercizio}
                onChange={e=>{set("nomeEsercizio",e.target.value);setApriAna(true);}}
                onFocus={()=>setApriAna(true)}
                onBlur={()=>setTimeout(()=>setApriAna(false),160)}/>
              {apriAna&&suggEs.length>0&&(
                <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:130,background:"rgba(12,16,26,.96)",border:"0.5px solid rgba(255,255,255,.16)",borderRadius:10,backdropFilter:"blur(30px)",boxShadow:"0 12px 36px rgba(0,0,0,.65)",maxHeight:230,overflowY:"auto",padding:4}}>
                  <div style={{fontSize:9,color:"var(--text-3)",padding:"6px 10px 4px",textTransform:"uppercase",letterSpacing:".07em"}}>Esercizi già in archivio — clicca per compilare</div>
                  {suggEs.map(es=>(
                    <div key={es.nomeEsercizio} onMouseDown={e=>{e.preventDefault();applicaAnagrafica(es);}}
                      style={{padding:"8px 11px",borderRadius:7,cursor:"pointer"}}
                      onMouseEnter={e=>e.currentTarget.style.background="rgba(226,201,126,.1)"}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <div style={{fontSize:13,fontWeight:600,color:"var(--text-1)"}}>{es.nomeEsercizio}</div>
                      <div style={{fontSize:11,color:"var(--text-3)",marginTop:1}}>
                        {es.indirizzo||"—"}{es.legaleRappresentante?` · ${es.legaleRappresentante}`:""} · {es.n} controll{es.n===1?"o":"i"}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </Field>
          <Field label="Indirizzo *" full>
            <input style={INP} placeholder="Via, n°" value={f.indirizzo} onChange={e=>{set("indirizzo",e.target.value);setNotaInd(null);}}
              onBlur={()=>{ if(!canone||!f.indirizzo.trim()) return; const p=proponiValore("indirizzo",f.indirizzo,canone,1);
                if(!p){ setNotaInd(null); return; }
                if(p.sicura){ set("indirizzo",p.nuovo); setNotaInd(null); }
                else { set("indirizzo",normalizzaIndirizzo(f.indirizzo)); setNotaInd(p.nuovo); } }}/>
            {notaInd&&<div style={{fontSize:11.5,color:"var(--orange)",marginTop:5,display:"flex",gap:8,flexWrap:"wrap"}}>
              <span>Forse intendevi <b>{notaInd}</b>?</span>
              <button type="button" style={btnLink} onClick={()=>{set("indirizzo",notaInd);setNotaInd(null);}}>Sì, correggi</button>
            </div>}
          </Field>
          <Field label="Ragione Sociale" full><input style={INP} placeholder="Es. Rossi S.r.l." value={f.ragioneSociale} onChange={e=>set("ragioneSociale",e.target.value)}/></Field>
          <Field label="Legale Rappresentante"><input style={INP} placeholder="Cognome Nome" value={f.legaleRappresentante} onChange={e=>set("legaleRappresentante",e.target.value)}/></Field>
          <Field label="P.IVA / C.F."><input style={INP} placeholder="—" value={f.piva} onChange={e=>set("piva",e.target.value)}/></Field>
          <Field label="Sottotipo attività" full>
            <InputSuggerito value={f.tipo} onChange={v=>set("tipo",v)} vocabolario={vocTipo} titoloElenco="Tipi già usati"
              placeholder="Es. Somministrazione, Locazione breve, Casa vacanze…" correggi={correggiTipo}
              onPiva={v=>{ if(!String(f.piva||"").trim()) set("piva",v); }}/>
          </Field>
          <Field label="Identificativo locale" full>
            <input style={{...INP,borderColor:avvisoDi("identificativo")?"rgba(224,82,82,.5)":undefined,fontFamily:"monospace",textTransform:"uppercase"}}
              placeholder="Es. SMCO-092 — facoltativo" value={f.identificativo||""}
              onChange={e=>set("identificativo",e.target.value.toUpperCase())}/>
            <div style={{fontSize:11,color:avvisoDi("identificativo")?"#e05252":"var(--text-2)",marginTop:4}}>
              {avvisoDi("identificativo")?avvisoDi("identificativo").t:"Aggancia il controllo all’anagrafe e ai provvedimenti. Individua il locale, non l’attività."}
            </div>
          </Field>
          {!haVerbale&&<Field label="Verbale n."><input style={INP} placeholder="—" value={f.numeroVerbale||""} onChange={e=>set("numeroVerbale",e.target.value)}/></Field>}
          <Field label="Ora del controllo"><input style={{...INP,colorScheme:"dark"}} type="time" value={f.ora||""} onChange={e=>set("ora",e.target.value)}/></Field>
        </div>
        <div style={{marginBottom:20}}>
          <button type="button" onClick={()=>setApriAnag(v=>!v)}
            style={{width:"100%",background:"none",border:"none",padding:0,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <SecTitle icon="🪪" text="Anagrafica del titolare"/>
            <span style={{fontSize:12,color:"var(--text-2)"}}>
              {anagVuota(f.anagrafica)?"non compilata":"compilata"} {apriAnag?"▴":"▾"}
            </span>
          </button>
          {!apriAnag&&(
            <div style={{fontSize:11,color:"var(--text-2)",marginTop:6,lineHeight:1.6}}>
              Fotografia alla data del controllo: resta com’è anche se domani il titolare cambia.
            </div>
          )}
          {apriAnag&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:12}}>
              {SCHEMA_ANAG.map(c=>{
                const av=avvisoDi(c.k);
                const bordo=av?(av.lieve?"rgba(226,201,126,.5)":"rgba(224,82,82,.5)"):undefined;
                return (
                  <Field key={c.k} label={c.et} full={!!c.largo}>
                    {c.voci
                      ? <select style={{...INP,cursor:"pointer"}} value={(f.anagrafica||{})[c.k]||""} onChange={e=>setA(c.k,e.target.value)}>
                          {c.voci.map(v=><option key={v} value={v}>{v||"— Seleziona —"}</option>)}
                        </select>
                      : <input style={{...INP,borderColor:bordo,colorScheme:"dark",
                            fontFamily:c.k==="cf"?"monospace":undefined,
                            textTransform:c.k==="cf"||c.k==="nato_prov"?"uppercase":undefined}}
                          type={c.tipo||"text"} placeholder="—"
                          value={(f.anagrafica||{})[c.k]||""}
                          onChange={e=>setA(c.k, c.k==="cf"||c.k==="nato_prov" ? e.target.value.toUpperCase() : e.target.value)}/>}
                    {av&&<div style={{fontSize:11,color:av.lieve?"#c9a84c":"#e05252",marginTop:4}}>{av.t}</div>}
                  </Field>
                );
              })}
              {(()=>{ const d=dataDaCF((f.anagrafica||{}).cf);
                if(!d||(f.anagrafica||{}).nato_il===d) return null;
                return <div style={{gridColumn:"1/-1"}}>
                  <button type="button" onClick={()=>setA("nato_il",d)}
                    style={{background:"none",border:"1px solid rgba(226,201,126,.3)",color:"#c9a84c",fontSize:12,padding:"6px 12px",borderRadius:7,cursor:"pointer"}}>
                    Usa {fmt(d)} come data di nascita (dal C.F.)
                  </button>
                </div>;
              })()}
              {avvisoDi("piva")&&<div style={{gridColumn:"1/-1",fontSize:11,color:"#e05252"}}>{avvisoDi("piva").t}</div>}
              <div style={{gridColumn:"1/-1",fontSize:11,color:"var(--text-2)",lineHeight:1.6}}>
                Gli avvisi non impediscono il salvataggio: sul verbale il dato può essere davvero scritto così.
              </div>
            </div>
          )}
        </div>

        <SecTitle icon="⚠️" text="Motivo del controllo"/>
        <div style={{marginBottom:20}}><Field label="Motivo del controllo"><TagInputSuggerito tags={f.motivoControllo} onChange={v=>set("motivoControllo",v)} vocabolario={vocMotivo} normalizza={normMotivo} nomeCampo="Motivo"
          titoloElenco="Motivi già usati" etichette={{noto:"Motivo già usato",libero:"Motivo nuovo"}} placeholder="Scegli dall’elenco o scrivi e premi Invio…"
          aiuto="Es. NOTA SUAP, ESPOSTO, NOTA C.D.R. — maiuscole e refusi si sistemano da soli."/></Field></div>
        <SecTitle icon="🚨" text="Violazioni riscontrate"/>
        <div style={{marginBottom:20}}><Field label="Violazioni riscontrate"><TagInputSuggerito tags={f.violazioniRiscontrate} onChange={v=>set("violazioniRiscontrate",v)} vocabolario={vocabolario} normalizza={normViol} nomeCampo="Violazioni" placeholder="Scrivi o scegli dall'elenco…"/></Field></div>
        <SecTitle icon="⚖️" text="Provvedimenti adottati"/>
        <ProvvedimentiEditor f={f} set={set}/>
        <SecTitle icon="📄" text="Titoli autorizzativi"/>
        <div style={{marginBottom:20}}><Field label="Autorizzazioni verificate"><TagInput tags={f.titoliAutorizzativi} onChange={v=>set("titoliAutorizzativi",v)} placeholder="Es. SCIA, Licenza commerciale… — Invio per aggiungere"/></Field></div>
        <SecTitle icon="📜" text="Riferimenti normativi"/>
        <div style={{marginBottom:24}}><Field label="Norme contestate"><TagInput tags={f.riferimenti} onChange={v=>set("riferimenti",v)} placeholder="Es. Art. 20 D.Lgs 81/2008 — Invio per aggiungere"/></Field></div>
        <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:10,paddingTop:16,borderTop:"1px solid var(--rim)",flexWrap:"wrap"}}>
          {mancaVerbale&&<span style={{flex:"1 1 240px",fontSize:12,color:"var(--orange)",lineHeight:1.5}}>
            ⚠ Manca {mancaVerbale.includes("numero")&&mancaVerbale.includes("importo")?"il n° di verbale e l’importo":mancaVerbale.includes("numero")?"il n° di verbale":"l’importo"}. Puoi salvare lo stesso: la scheda resta in «Completa da bollettario».
          </span>}
          <button onClick={chiudi} style={{background:"none",border:"1px solid var(--rim)",color:"var(--text-2)",fontSize:14,padding:"8px 18px",borderRadius:7,cursor:"pointer"}}>Annulla</button>
          <button disabled={!valid||saving} onClick={handleSave} style={{background:valid&&!saving?"var(--accent)":"rgba(226,201,126,.12)",color:valid&&!saving?"#0c0e14":"var(--accent-dim)",fontSize:14,fontWeight:600,padding:"8px 22px",border:"none",borderRadius:7,cursor:valid?"pointer":"not-allowed"}}>
            {saving?"⏳ Salvataggio…":isEdit?"💾 Aggiorna":"💾 Salva controllo"}
          </button>
        </div>
      </div>
    </Overlay>
  );
}

// ─── DETTAGLIO ────────────────────────────────────────────────────────────────
function DetailModal({record:r,onClose,onDelete,onEdit}){
  const DI=({label,value,color})=>(<div style={{display:"flex",flexDirection:"column",gap:3}}><span style={{fontSize:11,color:"var(--text-2)"}}>{label}</span><span style={{fontSize:14,color:color||"#e8e6df"}}>{value||"—"}</span></div>);
  return (
    <Overlay onBgClick={onClose}>
      <div className="overlay-modal" style={{background:"rgba(10,14,22,0.88)",border:"0.5px solid rgba(255,255,255,0.14)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",borderRadius:14,width:"100%",maxWidth:640,padding:28}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
          <div><div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:22,fontWeight:700}}>{r.nomeEsercizio}</div><div style={{fontSize:12,color:"var(--text-2)",marginTop:3}}>{r.indirizzo} — {fmt(r.data)}{r.ora?` ore ${r.ora}`:""}{r.numeroVerbale&&<span style={{marginLeft:8,background:"rgba(255,255,255,0.08)",color:"var(--accent)",fontSize:11,padding:"1px 7px",borderRadius:4}}>Verbale {r.numeroVerbale}</span>}</div></div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-2)",cursor:"pointer",fontSize:24,lineHeight:1}}>×</button>
        </div>
        <div style={{marginBottom:18}}><SecTitle icon="📋" text="Dati esercizio"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 24px"}}><DI label="Tipo attività" value={r.tipoAttivita}/><DI label="Sottotipo" value={r.tipo}/>
            <DI label="Ragione Sociale" value={r.ragioneSociale}/><DI label="Legale Rappresentante" value={r.legaleRappresentante||r.titolare}/>
            <DI label="P.IVA / C.F." value={r.piva}/><DI label="Data e ora" value={`${fmt(r.data)}${r.ora?" ore "+r.ora:""}`}/>
            {(()=>{
              const ags=Array.isArray(r.agentiOp)?r.agentiOp:(r.agentiOp?r.agentiOp.split(",").map(s=>s.trim()).filter(Boolean):(r._agenti?r._agenti.split(",").map(s=>s.trim()).filter(Boolean):[]));
              if(!ags.length) return null;
              return <div style={{gridColumn:"1/-1"}}>
                <span style={{fontSize:11,color:"var(--text-2)",display:"block",marginBottom:4}}>Agenti operanti</span>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {ags.map((a,i)=>(
                    <span key={i} style={{background:hCol(a)+"30",color:hCol(a),border:`1px solid ${hCol(a)}60`,fontSize:13,padding:"3px 12px",borderRadius:999,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
                      <Avatar name={a} size={18}/>{a}
                    </span>
                  ))}
                </div>

            if(provs.length===0) return <span style={{fontSize:13,color:"var(--text-2)"}}>Nessun provvedimento</span>;

        <div style={{marginBottom:18}}><SecTitle icon="📄" text="Titoli autorizzativi"/>{!r.titoliAutorizzativi?.length?<span style={{fontSize:13,color:"var(--text-2)"}}>Nessuno</span>:<div style={{display:"flex",flexWrap:"wrap",gap:6}}>{r.titoliAutorizzativi.map((t,i)=><Badge key={i} label={t} fg="#7eb8f7" bg="rgba(126,184,247,.08)"/>)}</div>}</div>
        <div style={{marginBottom:16}}><SecTitle icon="📜" text="Riferimenti normativi"/>{!r.riferimenti?.length?<span style={{fontSize:13,color:"var(--text-2)"}}>Nessuno</span>:<div style={{display:"flex",flexWrap:"wrap",gap:6}}>{r.riferimenti.map((ref,i)=><Badge key={i} label={ref} fg="#c9a84c" bg="rgba(226,201,126,.08)"/>)}</div>}</div>
        {r.creatoDA&&<div style={{background:"var(--bg)",border:"1px solid var(--rim)",borderRadius:8,padding:"10px 14px",marginBottom:20,fontSize:12,color:"var(--text-2)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}><Avatar name={r.creatoDA} size={20}/><span>Inserito da <b style={{color:"var(--text-1)"}}>{r.creatoDA}</b> · {fmtTs(r.creatoIl)}</span></div>
          {r.modificatoDa&&<div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}><Avatar name={r.modificatoDa} size={20}/><span>Modificato da <b style={{color:"var(--text-1)"}}>{r.modificatoDa}</b> · {fmtTs(r.modificatoIl)}</span></div>}
        </div>}
        <div style={{display:"flex",justifyContent:"space-between",paddingTop:16,borderTop:"1px solid var(--rim)",flexWrap:"wrap",gap:8}}>
          <button onClick={()=>{onDelete(r.id);onClose();}} style={{background:"none",border:"1px solid #5a1a1a",color:"var(--red)",fontSize:13,padding:"7px 14px",borderRadius:7,cursor:"pointer"}}>🗑 Elimina</button>
          <div style={{display:"flex",gap:8,marginLeft:"auto"}}>
            <button onClick={()=>onEdit(r)} style={{background:"none",border:"1px solid var(--rim)",color:"var(--accent)",fontSize:13,padding:"7px 14px",borderRadius:7,cursor:"pointer"}}>✏️ Modifica</button>
            <button onClick={onClose} style={{background:"none",border:"1px solid var(--rim)",color:"var(--text-2)",fontSize:13,padding:"7px 14px",borderRadius:7,cursor:"pointer"}}>Chiudi</button>
          </div>
        </div>
      </div>
    </Overlay>
  );
}

// ─── MULTI-EDIT MODAL (Tabbed) ───────────────────────────────────────────────
function MultiEditModal({initialRecords, operatore, onSave, onClose, canone=null, vocAgenti=[], vocTipo=[], vocMotivo=[], vocabolario=[]}){
  const [activeTab,setActiveTab]=useState(0);
  const [forms,setForms]=useState(()=>initialRecords.map(r=>{
    const provs = r.provvedimenti?.length>0 ? r.provvedimenti : (r.provvedimento?[{tipo:r.provvedimento,note:r.note||"",importo:r.importoSanzione||""}]:[{tipo:"",note:"",importo:""}]);
    return importoNelVerbale({...EMPTY,...r,motivoControllo:r.motivoControllo||[],violazioniRiscontrate:r.violazioniRiscontrate||[],riferimenti:r.riferimenti||[],titoliAutorizzativi:r.titoliAutorizzativi||[],provvedimenti:provs,agentiOp:Array.isArray(r.agentiOp)?r.agentiOp:(r.agentiOp?r.agentiOp.split(",").map(s=>s.trim()).filter(Boolean):(r._agenti?r._agenti.split(",").map(s=>s.trim()).filter(Boolean):[])),ragioneSociale:r.ragioneSociale||"",legaleRappresentante:r.legaleRappresentante||r.titolare||"",tipoAttivita:r.tipoAttivita||""});
  }));
  const [saved,setSaved]=useState(()=>new Set());
  const [savingIdx,setSavingIdx]=useState(-1);

  const setField=(idx,k,v)=>setForms(prev=>{ const n=[...prev]; n[idx]={...n[idx],[k]:v}; return n; });
  const f=forms[activeTab]||forms[0];
  const set=(k,v)=>setField(activeTab,k,v);
  const valid=f.nomeEsercizio?.trim()&&f.indirizzo?.trim();

  const handleSaveOne=async(idx)=>{
    const rec=forms[idx]; if(!rec.nomeEsercizio?.trim()||!rec.indirizzo?.trim()) return;
    setSavingIdx(idx);
    // Strip internal fields
    const {id,...data}=rec;
    await onSave(pulisciRecord(sincronizzaProvvedimenti({id,...data}),canone));
    setSaved(prev=>new Set(prev).add(idx));
    setSavingIdx(-1);
  };

  const handleSaveAll=async()=>{
    for(let i=0;i<forms.length;i++){
      const rec=forms[i];
      if(rec.nomeEsercizio?.trim()&&rec.indirizzo?.trim()&&!saved.has(i)){
        setSavingIdx(i); setActiveTab(i);
        const {id,...data}=rec;
        await onSave(pulisciRecord(sincronizzaProvvedimenti({id,...data}),canone));
        setSaved(prev=>new Set(prev).add(i));
        setSavingIdx(-1);
      }
    }
  };

  const unsavedCount=forms.filter((_,i)=>!saved.has(i)).length;

  return (
    <Overlay>
      <div className="overlay-modal" style={{background:"rgba(10,14,22,0.88)",border:"0.5px solid rgba(255,255,255,0.14)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",borderRadius:14,width:"100%",maxWidth:740,padding:0,maxHeight:"94vh",display:"flex",flexDirection:"column"}}>
        {/* Header */}
        <div style={{padding:"20px 24px 0",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div>
              <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:20,fontWeight:700}}>✏️ Modifica multipla</div>
              <div style={{fontSize:12,color:"var(--text-2)",marginTop:3}}>
                {forms.length} record in modifica · {saved.size} salvat{saved.size===1?"o":"i"} · <span style={{color:unsavedCount>0?"#c9a84c":"#52b788"}}>{unsavedCount} da salvare</span>
              </div>
            </div>
            <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-2)",cursor:"pointer",fontSize:22,lineHeight:1}}>×</button>
          </div>

          {/* Tab bar */}
          <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:12,borderBottom:"1px solid var(--rim)"}}>
            {forms.map((rec,i)=>{
              const active=activeTab===i;
              const isSaved=saved.has(i);
              return (
                <button key={i} onClick={()=>setActiveTab(i)} style={{
                  background:active?"#252d42":"transparent",
                  border:`1px solid ${active?"rgba(226,201,126,.3)":"#2a3049"}`,
                  borderRadius:"8px 8px 0 0",
                  padding:"7px 14px",
                  cursor:"pointer",
                  display:"flex",alignItems:"center",gap:6,
                  whiteSpace:"nowrap",flexShrink:0,
                  transition:"all .15s"
                }}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:isSaved?"#52b788":"#c9a84c",flexShrink:0,boxShadow:isSaved?"0 0 6px #52b788":"none"}}></span>
                  <span style={{fontSize:12,fontWeight:active?700:400,color:active?"#e8e6df":"#7a859e",maxWidth:130,overflow:"hidden",textOverflow:"ellipsis"}}>{rec.nomeEsercizio||`Record ${i+1}`}</span>
                  {savingIdx===i&&<span style={{fontSize:10,color:"var(--accent)"}}>⏳</span>}
                </button>
              );
            })}
          </div>
        </div>

        {/* Form body — scrollable */}
        <div style={{flex:1,overflowY:"auto",padding:"16px 24px 0"}}>
          <SecTitle icon="📋" text="Dati esercizio"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
            <Field label="Tipo attività *" full>
              <select style={{...INP,cursor:"pointer",fontWeight:600}} value={f.tipoAttivita||""} onChange={e=>set("tipoAttivita",e.target.value)}>
                <option value="">— Seleziona tipo attività —</option>
                <option value="Attività Commerciale">🏪 Attività Commerciale</option>
                <option value="Attività Ricettiva Extralberghiera">🏠 Attività Ricettiva Extralberghiera</option>
              </select>
            </Field>
            <Field label="Data controllo"><input style={{...INP,colorScheme:"dark"}} type="date" value={f.data||""} onChange={e=>set("data",e.target.value)}/></Field>
            <Field label="Agenti / Operatori" full><TagInputSuggerito tags={f.agentiOp||[]} onChange={v=>set("agentiOp",v)} vocabolario={vocAgenti} virgola
              normalizza={t=>normalizzaAgentiDigitati(t,canone)} titoloElenco="Operanti già presenti nelle schede"
              etichette={{noto:"Operante già presente nelle schede",libero:"Nome nuovo: controlla che sia scritto bene"}}
              placeholder="Cognome — scegli dall’elenco o scrivi e premi Invio" aiuto="Gradi, maiuscole e refusi evidenti si correggono da soli."/></Field>
            <Field label="Nome / Denominazione *" full><input style={INP} placeholder="Es. Pasticceria Rossi" value={f.nomeEsercizio||""} onChange={e=>set("nomeEsercizio",e.target.value)}/></Field>
            <Field label="Indirizzo *" full><input style={INP} placeholder="Via, n°, città" value={f.indirizzo||""} onChange={e=>set("indirizzo",e.target.value)}/></Field>
            <Field label="Ragione Sociale" full><input style={INP} placeholder="Es. Rossi S.r.l." value={f.ragioneSociale||""} onChange={e=>set("ragioneSociale",e.target.value)}/></Field>
            <Field label="Legale Rappresentante"><input style={INP} placeholder="Cognome Nome" value={f.legaleRappresentante||""} onChange={e=>set("legaleRappresentante",e.target.value)}/></Field>
            <Field label="P.IVA / C.F."><input style={INP} placeholder="—" value={f.piva||""} onChange={e=>set("piva",e.target.value)}/></Field>
            <Field label="Sottotipo attività" full><InputSuggerito value={f.tipo||""} onChange={v=>set("tipo",v)} vocabolario={vocTipo} titoloElenco="Tipi già usati"
              placeholder="Es. Somministrazione, Locazione breve…" correggi={v=>canone?proponiValore("tipo",v,canone,1):null}
              onPiva={v=>{ if(!String(f.piva||"").trim()) set("piva",v); }}/></Field>
          </div>
          <SecTitle icon="⚠️" text="Motivo del controllo"/>
          <div style={{marginBottom:18}}><Field label="Motivo del controllo"><TagInputSuggerito tags={f.motivoControllo||[]} onChange={v=>set("motivoControllo",v)} vocabolario={vocMotivo}
            normalizza={normalizzatoreVoce("motivo",canone)} titoloElenco="Motivi già usati" etichette={{noto:"Motivo già usato",libero:"Motivo nuovo"}}
            placeholder="Scegli dall’elenco o scrivi e premi Invio…" aiuto="Maiuscole e refusi si sistemano da soli."/></Field></div>
          <SecTitle icon="🚨" text="Violazioni riscontrate"/>
          <div style={{marginBottom:18}}><Field label="Violazioni riscontrate"><TagInputSuggerito tags={f.violazioniRiscontrate||[]} onChange={v=>set("violazioniRiscontrate",v)} vocabolario={vocabolario}
            normalizza={normalizzatoreVoce("violazioni",canone)} placeholder="Scrivi o scegli dall'elenco…"/></Field></div>
          <SecTitle icon="⚖️" text="Provvedimenti adottati"/>
          <ProvvedimentiEditor f={f} set={set}/>
          <SecTitle icon="📄" text="Titoli autorizzativi"/>
          <div style={{marginBottom:18}}><Field label="Autorizzazioni verificate"><TagInput tags={f.titoliAutorizzativi||[]} onChange={v=>set("titoliAutorizzativi",v)} placeholder="Es. SCIA, Licenza commerciale…"/></Field></div>
          <SecTitle icon="📜" text="Riferimenti normativi"/>
          <div style={{marginBottom:18}}><Field label="Norme contestate"><TagInput tags={f.riferimenti||[]} onChange={v=>set("riferimenti",v)} placeholder="Es. Art. 20 D.Lgs 81/2008"/></Field></div>
        </div>

        {/* Footer — sticky */}
        <div style={{padding:"14px 24px",borderTop:"1px solid var(--rim)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,flexWrap:"wrap",gap:8,background:"rgba(255,255,255,0.05)",borderRadius:"0 0 14px 14px"}}>
          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
            {/* Quick nav arrows */}
            <button disabled={activeTab===0} onClick={()=>setActiveTab(p=>p-1)} style={{background:"none",border:"1px solid var(--rim)",color:activeTab===0?"#2a3049":"#7a859e",fontSize:14,padding:"6px 10px",borderRadius:6,cursor:activeTab===0?"not-allowed":"pointer"}}>◀</button>
            <span style={{fontSize:12,color:"var(--text-2)"}}>{activeTab+1}/{forms.length}</span>
            <button disabled={activeTab>=forms.length-1} onClick={()=>setActiveTab(p=>p+1)} style={{background:"none",border:"1px solid var(--rim)",color:activeTab>=forms.length-1?"#2a3049":"#7a859e",fontSize:14,padding:"6px 10px",borderRadius:6,cursor:activeTab>=forms.length-1?"not-allowed":"pointer"}}>▶</button>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={onClose} style={{background:"none",border:"1px solid var(--rim)",color:"var(--text-2)",fontSize:13,padding:"8px 16px",borderRadius:7,cursor:"pointer"}}>Chiudi</button>
            <button disabled={!valid||savingIdx===activeTab||saved.has(activeTab)} onClick={()=>handleSaveOne(activeTab)} style={{
              background:valid&&savingIdx!==activeTab&&!saved.has(activeTab)?"#252d42":"#1a1e2a",
              border:`1px solid ${saved.has(activeTab)?"#52b78860":"rgba(226,201,126,.3)"}`,
              color:saved.has(activeTab)?"#52b788":valid?"#c9a84c":"#5a4a1e",
              fontSize:13,fontWeight:600,padding:"8px 16px",borderRadius:7,cursor:valid&&!saved.has(activeTab)?"pointer":"not-allowed"
            }}>
              {saved.has(activeTab)?"✅ Salvato":savingIdx===activeTab?"⏳…":"💾 Salva questo"}
            </button>
            <button disabled={unsavedCount===0} onClick={handleSaveAll} style={{
              background:unsavedCount>0?"#c9a84c":"#5a4a1e",
              color:unsavedCount>0?"#0f1117":"#7a6030",
              fontSize:13,fontWeight:700,padding:"8px 18px",border:"none",borderRadius:7,cursor:unsavedCount>0?"pointer":"not-allowed"
            }}>
              {unsavedCount>0?`💾 Salva tutti (${unsavedCount})`:"✅ Tutti salvati"}
            </button>
          </div>
        </div>
      </div>
    </Overlay>
  );
}

// ─── DATA CORRECTOR — Ricettive Extralberghiere ─────────────────────────────
function DataCorrectorModal({records, db, operatore, onClose, onDone}){
  // Show all records — user selects which to correct
  const allRecords = records;
  
  // Smart split: address up to and including civico, rest = nome struttura
  const splitIndirizzo = (raw) => {
    if(!raw) return {indirizzo:"", nome:""};
    // Try to find civico pattern: number possibly followed by letter/slash
    const m = raw.match(/^(.*?\d+[a-zA-Z]?(?:\/\d+[a-zA-Z]?)?)\s*[,\-–]?\s*(.*)$/);
    if(m && m[2]) return {indirizzo: m[1].trim(), nome: m[2].trim()};
    // Fallback: no split possible
    return {indirizzo: raw.trim(), nome: ""};
  };

  // Build correction preview
  const [corrections, setCorrections] = useState(()=>
    allRecords.map(r => {
      const split = splitIndirizzo(r.indirizzo||"");
      return {
        id: r.id,
        original: r,
        // What goes where:
        nomeEsercizio: split.nome || r.nomeEsercizio || "",         // extracted from indirizzo (after civico)
        indirizzo: split.indirizzo || "",                            // keep address part
        legaleRappresentante: r.nomeEsercizio || "",                 // current nome → legale rapp
        tipo: r.piva || "",                                          // current piva → sottotipo
        piva: "",                                                    // clear
        ragioneSociale: "Ditta Individuale",                         // fixed
        titoliAutorizzativi: (r.legaleRappresentante||r.titolare)    // current legale rapp → titoli
          ? [r.legaleRappresentante||r.titolare] 
          : (r.titoliAutorizzativi||[]),
        _checked: false,  // default unchecked — user picks which to fix
        _splitOk: !!split.nome,  // whether auto-split succeeded
      };
    })
  );

  const setCorr = (idx, key, val) => setCorrections(prev => {
    const n=[...prev]; n[idx]={...n[idx],[key]:val}; return n;
  });

  const toggleCheck = idx => setCorr(idx, "_checked", !corrections[idx]._checked);
  const checkedCount = corrections.filter(c=>c._checked).length;

  // Motivo del controllo — uguale per tutti
  const MOTIVI_OPZIONI = ["Nota SUAP","Nota Uffici","Esposto"];
  const [motivoMassa, setMotivoMassa] = useState("");

  const [applying, setApplying] = useState(false);
  const [done, setDone] = useState(false);
  const [progress, setProgress] = useState(0);

  const handleApply = async () => {
    const toFix = corrections.filter(c=>c._checked);
    if(!toFix.length) return;
    setApplying(true);
    const now = firebase.firestore.FieldValue.serverTimestamp();
    // Use batches of max 500
    let count = 0;
    for(let i=0; i<toFix.length; i+=450){
      const batch = db.batch();
      const chunk = toFix.slice(i, i+450);
      chunk.forEach(c => {
        const ref = db.collection(COLL).doc(c.id);
        const upd = {
          nomeEsercizio: c.nomeEsercizio,
          indirizzo: c.indirizzo,
          legaleRappresentante: c.legaleRappresentante,
          tipo: c.tipo,
          piva: c.piva,
          ragioneSociale: c.ragioneSociale,
          titoliAutorizzativi: c.titoliAutorizzativi,
          modificatoDa: operatore.nome,
          modificatoIl: now,
        };
        if(motivoMassa) upd.motivoControllo = [motivoMassa];
        batch.update(ref, upd);
      });
      await batch.commit();
      count += chunk.length;
      setProgress(count);
    }
    // Log
    try {
      await db.collection(COLL_LOG).add({
        azione: "modifica",
        dettaglio: `Correzione dati di massa (ricettive): ${count} record corretti${motivoMassa?` · Motivo: ${motivoMassa}`:""}`,
        operatore: operatore.nome,
        matricola: operatore.matricola||"",
        timestamp: now,
      });
    } catch(_){}
    setDone(true);
    setApplying(false);
    if(onDone) onDone();
  };

  // Expandable row view
  const [expandedIdx, setExpandedIdx] = useState(null);

  if(done){
    return (
      <Overlay>
        <div className="overlay-modal" style={{background:"rgba(255,255,255,0.05)",border:"1px solid #52b78860",borderRadius:14,width:"100%",maxWidth:560,padding:32,textAlign:"center"}}>
          <div style={{fontSize:52,marginBottom:16}}>✅</div>
          <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:22,fontWeight:700,marginBottom:8}}>Correzione completata!</div>
          <div style={{fontSize:14,color:"var(--text-2)",marginBottom:24}}>{progress} record corretti con successo.</div>
          <button onClick={onClose} style={{background:"var(--accent)",color:"#0c0e14",fontSize:14,fontWeight:700,padding:"10px 28px",border:"none",borderRadius:8,cursor:"pointer"}}>Chiudi →</button>
        </div>
      </Overlay>
    );
  }

  return (
    <Overlay>
      <div className="overlay-modal" style={{background:"rgba(255,255,255,0.05)",border:"1px solid #f7a05260",borderRadius:14,width:"100%",maxWidth:900,padding:0,maxHeight:"94vh",display:"flex",flexDirection:"column"}}>
        {/* Header */}
        <div style={{padding:"22px 24px 0",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div>
              <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:20,fontWeight:700}}>🔧 Correttore Dati</div>
              <div style={{fontSize:12,color:"var(--text-2)",marginTop:4}}>
                <b style={{color:"var(--orange)"}}>{allRecords.length}</b> record nel database · <b style={{color:"var(--accent)"}}>{checkedCount}</b> selezionate per la correzione
              </div>
            </div>
            <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-2)",cursor:"pointer",fontSize:22,lineHeight:1}}>×</button>
          </div>

          {/* Mapping legend */}
          <div style={{background:"var(--bg)",border:"1px solid var(--rim)",borderRadius:9,padding:"12px 16px",marginBottom:14,fontSize:11,lineHeight:1.8}}>
            <div style={{fontSize:10,color:"var(--orange)",letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600,marginBottom:6}}>Mappa delle correzioni</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"2px 20px",color:"var(--text-2)"}}>
              <div>Nome/Denominazione <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--green)"}}>Legale Rappresentante</span></div>
              <div>Indirizzo (dopo civico) <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--green)"}}>Nome/Denominazione</span></div>
              <div>P.IVA <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--green)"}}>Sottotipo attività</span></div>
              <div>Rag. Sociale <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--green)"}}>"Ditta Individuale"</span></div>
              <div>Legale Rapp. <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--green)"}}>Titoli autorizzativi</span></div>
              <div>P.IVA <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--green)"}}>svuotato</span></div>
            </div>
          </div>

          {/* Motivo del controllo — applicato a tutti */}
          <div style={{background:"rgba(126,184,247,.08)",border:"1px solid #7eb8f740",borderRadius:9,padding:"12px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:16}}>⚠️</span>
              <div>
                <div style={{fontSize:11,color:"var(--blue)",letterSpacing:"0.07em",textTransform:"uppercase",fontWeight:600}}>Motivo del controllo</div>
                <div style={{fontSize:11,color:"var(--text-2)",marginTop:1}}>Sarà applicato a tutti i record selezionati</div>
              </div>
            </div>
            <select value={motivoMassa} onChange={e=>setMotivoMassa(e.target.value)} style={{...INP,width:"auto",minWidth:200,cursor:"pointer",fontWeight:600,fontSize:13,padding:"8px 12px",borderColor:motivoMassa?"#7eb8f760":"#2a3049"}}>
              <option value="">— Nessuno (non modificare) —</option>
              {MOTIVI_OPZIONI.map(m=><option key={m}>{m}</option>)}
            </select>
            {motivoMassa&&<span style={{fontSize:12,color:"var(--green)",fontWeight:600}}>✓ "{motivoMassa}" sarà inserito in tutti</span>}
          </div>
        </div>

        {/* Preview list — scrollable */}
        <div style={{flex:1,overflowY:"auto",padding:"0 24px 16px"}}>
          {/* Select all / deselect */}
          {corrections.length>0&&(
            <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center"}}>
              <button onClick={()=>setCorrections(prev=>prev.map(c=>({...c,_checked:true})))}
                style={{background:"none",border:"1px solid #c9a84c50",color:"var(--accent)",fontSize:11,fontWeight:600,padding:"5px 12px",borderRadius:6,cursor:"pointer"}}>
                ☑ Seleziona tutti ({corrections.length})
              </button>
              <button onClick={()=>setCorrections(prev=>prev.map(c=>({...c,_checked:false})))}
                style={{background:"none",border:"1px solid var(--rim)",color:"var(--text-2)",fontSize:11,padding:"5px 12px",borderRadius:6,cursor:"pointer"}}>
                ☐ Deseleziona tutti
              </button>
              <span style={{fontSize:11,color:"var(--text-2)",marginLeft:"auto"}}>{checkedCount} di {corrections.length} selezionati</span>
            </div>
          )}
          {corrections.length===0
            ?<div style={{textAlign:"center",padding:48,color:"var(--text-2)"}}>Nessun record trovato nel database.</div>
            :corrections.map((c,idx)=>{
              const expanded = expandedIdx===idx;
              return (
                <div key={c.id} style={{
                  background:c._checked?"#0f1117":"#0f111780",
                  border:`1px solid ${!c._splitOk?"#e0525240":c._checked?"#2a3049":"#1a1e2a"}`,
                  borderRadius:10, marginBottom:8, overflow:"hidden",
                  opacity:c._checked?1:0.5, transition:"all .15s"
                }}>
                  {/* Summary row */}
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",cursor:"pointer"}}
                    onClick={()=>setExpandedIdx(expanded?null:idx)}>
                    <input type="checkbox" checked={c._checked} onChange={()=>toggleCheck(idx)}
                      onClick={e=>e.stopPropagation()}
                      style={{width:16,height:16,accentColor:"#c9a84c",cursor:"pointer",flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,fontSize:14,color:"var(--text-1)"}}>{c.nomeEsercizio||"⚠️ Nome non estratto"}</span>
                        {!c._splitOk&&<span style={{background:"rgba(224,82,82,.1)",color:"var(--red)",fontSize:10,padding:"2px 8px",borderRadius:4,fontWeight:600}}>⚠ Verifica divisione indirizzo</span>}
                      </div>
                      <div style={{fontSize:12,color:"var(--text-2)",marginTop:2}}>{c.indirizzo} · Legale: {c.legaleRappresentante} · Tipo: {c.tipo||"—"}</div>
                    </div>
                    <span style={{color:"var(--text-2)",fontSize:16,flexShrink:0,transition:"transform .2s",transform:expanded?"rotate(180deg)":"rotate(0)"}}>{expanded?"▾":"▸"}</span>
                  </div>

                  {/* Expanded edit */}
                  {expanded&&(
                    <div style={{padding:"0 14px 14px",borderTop:"1px solid var(--rim)"}}>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,paddingTop:12}}>
                        {/* Current vs corrected, editable */}
                        <div>
                          <div style={{fontSize:10,color:"var(--red)",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:8,fontWeight:600}}>📌 Dati originali (attuali)</div>
                          <div style={{fontSize:12,color:"var(--text-2)",lineHeight:2}}>
                            <div>Nome: <b style={{color:"var(--text-1)"}}>{c.original.nomeEsercizio||"—"}</b></div>
                            <div>Indirizzo: <b style={{color:"var(--text-1)"}}>{c.original.indirizzo||"—"}</b></div>
                            <div>Legale Rapp.: <b style={{color:"var(--text-1)"}}>{c.original.legaleRappresentante||c.original.titolare||"—"}</b></div>
                            <div>P.IVA: <b style={{color:"var(--text-1)"}}>{c.original.piva||"—"}</b></div>
                            <div>Rag. Sociale: <b style={{color:"var(--text-1)"}}>{c.original.ragioneSociale||"—"}</b></div>
                          </div>
                        </div>
                        <div>
                          <div style={{fontSize:10,color:"var(--green)",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:8,fontWeight:600}}>✅ Valori corretti (modificabili)</div>
                          <div style={{display:"flex",flexDirection:"column",gap:6}}>
                            <Field label="Nome struttura">
                              <input style={{...INP,fontSize:12,padding:"6px 8px"}} value={c.nomeEsercizio}
                                onChange={e=>setCorr(idx,"nomeEsercizio",e.target.value)}/>
                            </Field>
                            <Field label="Indirizzo">
                              <input style={{...INP,fontSize:12,padding:"6px 8px"}} value={c.indirizzo}
                                onChange={e=>setCorr(idx,"indirizzo",e.target.value)}/>
                            </Field>
                            <Field label="Legale Rappresentante">
                              <input style={{...INP,fontSize:12,padding:"6px 8px"}} value={c.legaleRappresentante}
                                onChange={e=>setCorr(idx,"legaleRappresentante",e.target.value)}/>
                            </Field>
                            <Field label="Sottotipo">
                              <input style={{...INP,fontSize:12,padding:"6px 8px"}} value={c.tipo}
                                onChange={e=>setCorr(idx,"tipo",e.target.value)}/>
                            </Field>
                            <Field label="Titoli autorizzativi">
                              <input style={{...INP,fontSize:12,padding:"6px 8px"}} 
                                value={c.titoliAutorizzativi.join(", ")}
                                onChange={e=>setCorr(idx,"titoliAutorizzativi",e.target.value.split(",").map(s=>s.trim()).filter(Boolean))}/>
                            </Field>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })
          }
        </div>

        {/* Footer */}
        <div style={{padding:"14px 24px",borderTop:"1px solid var(--rim)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,flexWrap:"wrap",gap:8,background:"rgba(255,255,255,0.05)",borderRadius:"0 0 14px 14px"}}>
          <div style={{fontSize:12,color:"var(--text-2)"}}>
            {corrections.filter(c=>!c._splitOk&&c._checked).length>0&&
              <span style={{color:"var(--red)"}}>⚠ {corrections.filter(c=>!c._splitOk&&c._checked).length} record con divisione indirizzo da verificare — espandi per correggere</span>
            }
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={onClose} style={{background:"none",border:"1px solid var(--rim)",color:"var(--text-2)",fontSize:13,padding:"8px 16px",borderRadius:7,cursor:"pointer"}}>Annulla</button>
            <button disabled={checkedCount===0||applying} onClick={handleApply} style={{
              background:checkedCount>0&&!applying?"#f7a052":"#3a2010",
              color:checkedCount>0&&!applying?"#0f1117":"#7a6030",
              fontSize:13,fontWeight:700,padding:"8px 20px",border:"none",borderRadius:7,
              cursor:checkedCount>0?"pointer":"not-allowed"
            }}>
              {applying?`⏳ Correzione in corso… (${progress}/${checkedCount})`:`🔧 Correggi ${checkedCount} record`}
            </button>
          </div>
        </div>
      </div>
    </Overlay>
  );
}

// ─── SCHEDA PDF ───────────────────────────────────────────────────────────────
function schedaPDF(esercizio, interventi){
  const oggi = new Date().toLocaleDateString("it-IT");

  // Raccoglie tutti i titoli autorizzativi unici da tutti gli interventi
  const tuttiTitoli = [...new Set(interventi.flatMap(r=>r.titoliAutorizzativi||[]))];
  const tuttiRiferimenti = [...new Set(interventi.flatMap(r=>r.riferimenti||[]))];
  const totViolazioni = interventi.reduce((s,r)=>s+(r.motivoControllo?.length||0),0);
  const provAdottati = [...new Set(interventi.map(r=>r.provvedimento).filter(Boolean))];

  const html = `<!DOCTYPE html>
<html lang="it">
<head>

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 14px}

    .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
    .tag{border-radius:3px;padding:1px 6px;font-size:7pt;border:1px solid}
    .tag-red{background:#fde8e8;border-color:#e05252;color:#8c1a1a}
    .tag-blue{background:#e8f0fe;border-color:#3a6fa8;color:#1a3a6e}
    .tag-gold{background:#fef9e7;border-color:#c9a84c;color:#7a5c00}
    .tag-green{background:#e8f8f0;border-color:#2e8b57;color:#1a4d30}

    .riepilogo-box{background:#f5f7fa;border:1px solid #d0d8e8;border-radius:4px;padding:6px 10px;margin-bottom:10px}

    .intervento{border:1px solid #c0cce0;border-radius:4px;padding:7px 10px;margin-bottom:7px;page-break-inside:avoid}
    .intervento:nth-child(odd){background:#fafbfd}
    .int-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid #dde4f0}
    .int-num{font-size:9.5pt;font-weight:bold;color:#1a3a6e}
    .int-verbale{font-size:7pt;color:#555;background:#e8f0fe;border-radius:2px;padding:1px 5px;margin-left:6px;vertical-align:middle}
    .int-meta{font-size:7.5pt;color:#555;margin-top:1px}

    .sub-label{font-size:6.5pt;color:#1a3a6e;font-weight:bold;margin-bottom:3px;margin-top:5px;text-transform:uppercase;letter-spacing:.05em}
    .note-box{font-size:8pt;color:#222;margin-top:5px;padding:4px 8px;background:#fffbe6;border-left:2px solid #c9a84c;border-radius:0 3px 3px 0}
