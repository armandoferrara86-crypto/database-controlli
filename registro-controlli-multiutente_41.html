    .footer{border-top:1px solid #ccc;padding-top:5px;margin-top:12px;font-size:6.5pt;color:#888;display:flex;justify-content:space-between}
    @media print{
      body{padding:10px 14px}
      @page{margin:.8cm;size:A4}
    }
  </style>
</head>
<body>

  <!-- INTESTAZIONE -->
  <div class="header">
    <div>
      <h1>Scheda Esercizio Commerciale</h1>
      <div class="header-sub">Polizia Municipale di Napoli &nbsp;·&nbsp; Registro Controlli Commerciali</div>
    </div>
    <div class="header-right">
      <b>${esercizio.nomeEsercizio||""}</b><br/>
      Generato il ${oggi}<br/>
      N. interventi: <b>${interventi.length}</b>
    </div>
  </div>

  <!-- DATI ANAGRAFICI ESERCIZIO -->
  <div class="section">
    <div class="section-title">📋 Dati anagrafici esercizio</div>
    <div class="grid2">
      <div class="field"><label>Denominazione</label><span><b>${esercizio.nomeEsercizio||"—"}</b></span></div>
      <div class="field"><label>Tipologia attività</label><span>${esercizio.tipo||"—"}</span></div>
      <div class="field"><label>Indirizzo</label><span>${esercizio.indirizzo||"—"}</span></div>
      <div class="field"><label>Titolare / Rappresentante legale</label><span>${esercizio.titolare||"—"}</span></div>
      <div class="field"><label>Partita IVA / C.F.</label><span>${esercizio.piva||"—"}</span></div>
    </div>

  <!-- TITOLI AUTORIZZATIVI -->
  <div class="section">
    <div class="section-title">📄 Titoli autorizzativi verificati</div>
    ${tuttiTitoli.length
      ? `<div class="tags">${tuttiTitoli.map(t=>`<span class="tag tag-blue">${t}</span>`).join("")}</div>`
      : `<span style="font-size:10pt;color:#777">Nessun titolo autorizzativo registrato</span>`}
  </div>

  <!-- RIEPILOGO CONTROLLI -->
  <div class="riepilogo-box">
    <div class="section-title" style="border-color:#a0b4d0;margin-bottom:10px">📊 Riepilogo controlli effettuati</div>
    <div class="grid3">
      <div class="field"><label>Numero interventi</label><span><b>${interventi.length}</b></span></div>
      <div class="field"><label>Primo controllo</label><span>${fmt(interventi[interventi.length-1]?.data)||"—"}</span></div>
      <div class="field"><label>Ultimo controllo</label><span>${fmt(interventi[0]?.data)||"—"}</span></div>
      <div class="field"><label>Totale violazioni riscontrate</label><span style="color:${totViolazioni>0?"#8c1a1a":"#1a4d30"}"><b>${totViolazioni}</b></span></div>
      <div class="field" style="grid-column:2/-1"><label>Provvedimenti adottati</label><span>${provAdottati.length ? provAdottati.map(p=>`<span class="tag tag-red" style="margin-right:4px">${p}</span>`).join("") : "Nessuno"}</span></div>
    </div>
    ${tuttiRiferimenti.length?`<div style="margin-top:10px"><div class="field"><label>Riferimenti normativi contestati</label><div class="tags">${tuttiRiferimenti.map(r=>`<span class="tag tag-gold">${r}</span>`).join("")}</div></div></div>`:""}
  </div>

  <!-- DETTAGLIO INTERVENTI -->
  <div class="section">

// ─── EXPORT JSON ──────────────────────────────────────────────────────────────
function buildJsonRecord(r) {
  const provs = (r.provvedimenti||[]).filter(p=>p.tipo).map(p=>p.tipo);
  if(!provs.length && r.provvedimento) provs.push(r.provvedimento);
  const ags = Array.isArray(r.agentiOp) ? r.agentiOp
    : (r.agentiOp ? r.agentiOp.split(",").map(s=>s.trim()).filter(Boolean)
    : (r._agenti   ? r._agenti.split(",").map(s=>s.trim()).filter(Boolean) : []));
  const ts = r.creatoIl?.toDate ? r.creatoIl.toDate().toISOString()
           : r.creatoIl ? new Date(r.creatoIl).toISOString() : null;
  return {
    numeroVerbale:        r.numeroVerbale || null,
    data:                 r.data || null,
    ora:                  r.ora || null,
    nomeEsercizio:        r.nomeEsercizio || null,
    indirizzo:            r.indirizzo || null,
    ragioneSociale:       r.ragioneSociale || null,
    legaleRappresentante: r.legaleRappresentante || r.titolare || null,
    piva:                 r.piva || null,
    tipoAttivita:         r.tipoAttivita || null,
    tipoEsercizio:        r.tipo || null,
    titoliAutorizzativi:  r.titoliAutorizzativi || [],
    motivoControllo:      r.motivoControllo || [],
    violazioniRiscontrate:(r.violazioniRiscontrate||[]).filter(v=>v&&!v.toLowerCase().startsWith("nessun")),
    provvedimenti:        provs,
    importoSanzione:      r.importoSanzione || null,
    note:                 r.note || null,
    riferimentiNormativi: r.riferimenti || [],
    agenti:               ags,
    identificativo:       r.identificativo || null,
    numeroVerbale:        r.numeroVerbale || null,
    ora:                  r.ora || null,
    ...(r.anagrafica ? Object.fromEntries(SCHEMA_ANAG.map(x=>["tit_"+x.k, r.anagrafica[x.k]||null])) : {}),
    inseritoDa:           r.creatoDA || null,
    dataInserimento:      ts,
  };
}

function exportJSON(records, filename) {
  const data = records.map(buildJsonRecord);
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:"application/json;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename || `controlli_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function exportJSONSelected(records, ids, filename) {
  const sel = records.filter(r => ids.has(r.id));
  if(!sel.length) return;
  exportJSON(sel, filename || `controlli_selezionati_${new Date().toISOString().slice(0,10)}.json`);
}

// ─── REPORT STATISTICHE PDF ───────────────────────────────────────────────────
function generaStatsPDF(records, tariffario) {
  const oggi = new Date().toLocaleDateString("it-IT");

  // ── Calcoli ──
  const perMese = {};
  records.forEach(r => { if(!r.data) return; const [y,m]=r.data.split("-"); const k=`${y}-${m}`; perMese[k]=(perMese[k]||0)+1; });
  const mesiSorted = Object.entries(perMese).sort(([a],[b])=>a.localeCompare(b));

  const perEsercizio = {};
  records.forEach(r => { const k=(r.nomeEsercizio||"—").trim(); perEsercizio[k]=(perEsercizio[k]||0)+1; });
  const topEsercizi = Object.entries(perEsercizio).sort(([,a],[,b])=>b-a).slice(0,10);

  const perProv = {};
  records.forEach(r => { const k=r.provvedimento||"Nessuno"; perProv[k]=(perProv[k]||0)+1; });
  const provList = Object.entries(perProv).sort(([,a],[,b])=>b-a);

  const perTipo = {};
  records.forEach(r => { const k=(r.tipo||"Non specificato").trim(); perTipo[k]=(perTipo[k]||0)+1; });
  const tipoList = Object.entries(perTipo).sort(([,a],[,b])=>b-a).slice(0,8);

  const perViol = {};
  records.forEach(r => (r.violazioniRiscontrate||[]).filter(v=>v&&!v.toLowerCase().startsWith('nessun')).forEach(v => { const k=v.trim(); perViol[k]=(perViol[k]||0)+1; }));
  const topViol = Object.entries(perViol).sort(([,a],[,b])=>b-a).slice(0,10);

  const perMotivo = {};
  records.forEach(r => (r.motivoControllo||[]).forEach(v => { const k=v.trim(); perMotivo[k]=(perMotivo[k]||0)+1; }));
  const topMotivi = Object.entries(perMotivo).sort(([,a],[,b])=>b-a).slice(0,8);

  const perAgente = {};
  records.forEach(r => {
    const ags=Array.isArray(r.agentiOp)&&r.agentiOp.length>0?r.agentiOp:(r.agentiOp?r.agentiOp.split(",").map(s=>s.trim()).filter(Boolean):(r._agenti?r._agenti.split(",").map(s=>s.trim()).filter(Boolean):[r.creatoDA].filter(Boolean)));
    ags.forEach(a=>{ perAgente[a]=(perAgente[a]||0)+1; });
  });
  const topAgenti = Object.entries(perAgente).sort(([,a],[,b])=>b-a).slice(0,10);

  const calcolaSanzione = record => {
    // Sanzione manuale: precedenza assoluta
    if(record.importoSanzione && parseFloat(record.importoSanzione)>0) return parseFloat(record.importoSanzione);
    // Solo le violazioni riscontrate sono sanzionabili (il motivo del controllo non lo è)
    const violazioni = (record.violazioniRiscontrate||[]).filter(v=>v&&!v.toLowerCase().startsWith("nessun"));
    if(!violazioni.length) return 0;
    const STOP = /\b(mancante|mancanza|assenza|senza|non|del|della|delle|dei|degli|con|per|dal|dalla|nel|nella|una|uno|gli|che|sono|stato|come)\b/g;
    const keywords = str => str.toLowerCase().replace(STOP," ").replace(/[^a-z\u00e0-\u00f90-9\s]/g," ")
      .split(/\s+/).map(s=>s.trim()).filter(s=>s.length>=4);
    let tot = 0;
    const gia = new Set();
    violazioni.forEach(voce => {
      const vl = voce.toLowerCase().trim();
      const kwV = keywords(vl);
      const match = tariffario.find(t => {
        const tl = (t.voce||"").toLowerCase().trim();
        if(!tl) return false;
        if(vl === tl) return true;
        if(tl.length>=6 && vl.includes(tl)) return true;
        if(vl.length>=6 && tl.includes(vl)) return true;
        const kwT = keywords(tl);
        if(!kwT.length || !kwV.length) return false;
        if(kwT.filter(k=>kwV.includes(k)).length >= 2) return true;
        return kwT.some(k => k.length>=7 && kwV.includes(k));
      });

// Filtra records per periodo
function filtraPerPeriodo(records, dal, al) {
  if(!dal && !al) return records;
  return records.filter(r => {
    if(!r.data) return false;
    if(dal && r.data < dal) return false;
    if(al  && r.data > al)  return false;
    return true;
  });
}

    perStrada[via].controlli++;

    perStrada[via].records.push(r);

  const rs = filtraPerPeriodo(records, dal, al);
  const oggi = new Date().toLocaleDateString("it-IT");
  const periodo = dal||al ? `${dal?fmtPdfDate(dal):"inizio"} — ${al?fmtPdfDate(al):"oggi"}` : "Tutti i periodi";

  const perViol = {};
  rs.forEach(r => {
    (r.violazioniRiscontrate||[]).filter(v=>v&&!v.toLowerCase().startsWith('nessun')).forEach(v => {
      const k = v.trim();
      if(!perViol[k]) perViol[k] = {n:0, esercizi:new Set(), strade:new Set(), provvedimenti:{}};
      perViol[k].n++;
      perViol[k].esercizi.add((r.nomeEsercizio||"—").trim());
      perViol[k].strade.add((r.indirizzo||"").replace(/\s+\d.*$/,"").trim());
      const provs = (r.provvedimenti||[]).filter(p=>p.tipo).map(p=>p.tipo);
      if(!provs.length && r.provvedimento) provs.push(r.provvedimento);
      provs.forEach(p=>{ perViol[k].provvedimenti[p]=(perViol[k].provvedimenti[p]||0)+1; });
    });
  });

  const violList = Object.entries(perViol).sort(([,a],[,b])=>b.n-a.n);
  const maxV = violList.length>0 ? violList[0][1].n : 1;
  const totV = violList.reduce((s,[,d])=>s+d.n,0);

  const html = `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/>
  <title>Tabulato per Violazione</title><style>${CSS_BASE}</style></head><body>
  <div class="hdr">
    <div><h1>🚨 Tabulato Controlli per Violazione</h1>
      <div style="font-size:8pt;color:#555;margin-top:3px">Periodo: ${periodo} · ${totV} violazioni su ${rs.length} controlli</div>
    </div>
    <div class="hdr-r">U.O. San Lorenzo — Polizia Amministrativa<br/>Generato il ${oggi}</div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-v">${rs.length}</div><div class="kpi-l">Totale controlli</div></div>
    <div class="kpi"><div class="kpi-v" style="color:#c0392b">${totV}</div><div class="kpi-l">Totale violazioni</div></div>
    <div class="kpi"><div class="kpi-v">${violList.length}</div><div class="kpi-l">Tipologie violazioni</div></div>
    <div class="kpi"><div class="kpi-v" style="color:#c0392b">${rs.length>0?Math.round(rs.filter(r=>(r.violazioniRiscontrate||[]).length>0).length/rs.length*100):0}%</div><div class="kpi-l">Controlli con violazioni</div></div>
  </div>

  ${violList.length===0
    ? `<div style="text-align:center;padding:30px;color:#888;font-size:10pt">Nessuna violazione registrata nel periodo selezionato</div>`
    : `<table>
    <thead><tr>
      <th style="width:30px">#</th>
      <th>Tipo di violazione</th>
      <th style="width:60px;text-align:center">Casi</th>
      <th style="width:55px;text-align:center">%</th>
      <th style="width:60px;text-align:center">Esercizi</th>
      <th style="width:55px;text-align:center">Strade</th>
      <th>Provvedimenti associati</th>
      <th style="width:110px">Frequenza</th>
    </tr></thead>
    <tbody>
      ${violList.map(([v,d],i)=>`
        <tr>
          <td style="color:#777;font-size:7.5pt">${i+1}</td>
          <td><b style="color:#c0392b">${v}</b></td>
          <td style="text-align:center"><span class="num" style="color:#c0392b">${d.n}</span></td>
          <td style="text-align:center;font-size:7.5pt">${Math.round(d.n/totV*100)}%</td>
          <td style="text-align:center">${d.esercizi.size}</td>
          <td style="text-align:center">${d.strade.size}</td>
          <td style="font-size:7.5pt">${Object.entries(d.provvedimenti).map(([p,n])=>`<span class="pill" style="background:${provColorPdf(p)}">${p}(${n})</span>`).join(" ")||"—"}</td>
          <td>
            <div class="bar-wrap">
              <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(d.n/maxV*100)}%;background:#c0392b"></div></div>
              <span style="font-size:7pt;color:#c0392b;font-weight:bold">${d.n}</span>
            </div>
          </td>
        </tr>
        <tr><td colspan="8" style="padding:0 8px 7px;font-size:7pt;color:#888;background:#fff8f8;border-bottom:2px solid #f0d0d0">
          Esercizi coinvolti: ${[...d.esercizi].slice(0,6).join(", ")}${d.esercizi.size>6?` … +${d.esercizi.size-6} altri`:""}
        </td></tr>
      `).join("")}
    </tbody>
  </table>`}
  <div class="footer">
    <span>Polizia Municipale di Napoli — U.O. San Lorenzo</span>
    <span>Generato il ${oggi}</span>
  </div>
  <script>window.onload=function(){window.print()};<\/script>
  </body></html>`;
  apriPdf(html);
}

// ── 4. RIEPILOGO PER ESERCIZIO ──
function generaRiepilogoEsercizi(records, dal, al) {
  const rs = filtraPerPeriodo(records, dal, al);
  const oggi = new Date().toLocaleDateString("it-IT");
  const periodo = dal||al ? `${dal?fmtPdfDate(dal):"inizio"} — ${al?fmtPdfDate(al):"oggi"}` : "Tutti i periodi";

  const perEs = {};
  rs.forEach(r => {
    const k = (r.nomeEsercizio||"—").trim();
    if(!perEs[k]) perEs[k] = {nome:r.nomeEsercizio||"—", indirizzo:r.indirizzo||"—", titolare:r.legaleRappresentante||r.titolare||"—", tipo:r.tipo||"—", tipoAttivita:r.tipoAttivita||"—", controlli:0, violazioni:0, provvedimenti:{}, ultime:[], titoliSet:new Set()};
    perEs[k].controlli++;
    perEs[k].violazioni += (r.violazioniRiscontrate||[]).length;
    const provs = (r.provvedimenti||[]).filter(p=>p.tipo).map(p=>p.tipo);
    if(!provs.length && r.provvedimento) provs.push(r.provvedimento);
    provs.forEach(p=>{ perEs[k].provvedimenti[p]=(perEs[k].provvedimenti[p]||0)+1; });
    (r.titoliAutorizzativi||[]).forEach(t=>perEs[k].titoliSet.add(t));
    perEs[k].ultime.push(r.data||"");
  });

  const lista = Object.values(perEs).sort((a,b)=>b.controlli-a.controlli);

  const html = `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/>
  <title>Riepilogo per Esercizio</title><style>${CSS_BASE}
  .es-card{border:1px solid #c8d6ea;border-radius:5px;padding:10px 12px;margin-bottom:10px;page-break-inside:avoid}
  .es-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #e8edf5}
  .es-nome{font-size:10pt;font-weight:bold;color:#1a3a6e}
  .es-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 16px;font-size:7.5pt}
  .es-field label{color:#777;display:block;font-size:6.5pt;text-transform:uppercase;letter-spacing:.05em}
  </style></head><body>
  <div class="hdr">
    <div><h1>🏪 Riepilogo per Esercizio Commerciale</h1>
      <div style="font-size:8pt;color:#555;margin-top:3px">Periodo: ${periodo} · ${lista.length} esercizi · ${rs.length} controlli</div>
    </div>
    <div class="hdr-r">U.O. San Lorenzo — Polizia Amministrativa<br/>Generato il ${oggi}</div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-v">${lista.length}</div><div class="kpi-l">Esercizi controllati</div></div>
    <div class="kpi"><div class="kpi-v">${rs.length}</div><div class="kpi-l">Totale controlli</div></div>
    <div class="kpi"><div class="kpi-v" style="color:#c0392b">${lista.filter(e=>e.violazioni>0).length}</div><div class="kpi-l">Esercizi con violazioni</div></div>
    <div class="kpi"><div class="kpi-v" style="color:#d4961a">${lista.length>0?lista[0].nome.substring(0,18):"-"}</div><div class="kpi-l">Più controllato</div></div>
  </div>

  ${lista.map(e=>{
    const provStr = Object.entries(e.provvedimenti).map(([p,n])=>`<span class="pill" style="background:${provColorPdf(p)}">${p}(${n})</span>`).join(" ")||"<span style='color:#1e8449'>Nessuno</span>";
    const dateOrd = e.ultime.filter(Boolean).sort();
    const ultimaData = dateOrd.length>0?fmtPdfDate(dateOrd[dateOrd.length-1]):"—";
    const primaData  = dateOrd.length>0?fmtPdfDate(dateOrd[0]):"—";
    return `<div class="es-card">
      <div class="es-header">
        <div>
          <div class="es-nome">${e.nome}</div>
          <div style="font-size:7.5pt;color:#555;margin-top:1px">${e.indirizzo}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:14pt;font-weight:bold;color:#1a3a6e;line-height:1">${e.controlli}</div>
          <div style="font-size:6.5pt;color:#777">controlli</div>
          ${e.violazioni>0?`<div style="font-size:9pt;font-weight:bold;color:#c0392b;margin-top:2px">${e.violazioni} viol.</div>`:""}
        </div>
      </div>
      <div class="es-grid">
        <div class="es-field"><label>Titolare/L.R.</label>${e.titolare}</div>
        <div class="es-field"><label>Tipo attività</label>${e.tipoAttivita||e.tipo||"—"}</div>
        <div class="es-field"><label>Primo controllo</label>${primaData}</div>
        <div class="es-field"><label>Ultimo controllo</label>${ultimaData}</div>
        <div class="es-field"><label>Provvedimenti</label>${provStr}</div>
        <div class="es-field"><label>Titoli autoriz.</label><span style="font-size:7pt;color:#2471a3">${[...e.titoliSet].slice(0,3).join(", ")||"—"}</span></div>
      </div>
    </div>`;
  }).join("")}

  <div class="footer">
    <span>Polizia Municipale di Napoli — U.O. San Lorenzo</span>
    <span>Generato il ${oggi}</span>
  </div>
  <script>window.onload=function(){window.print()};<\/script>
  </body></html>`;
  apriPdf(html);
}

// ── 5. TOTALI E KPI ──
function generaTotaliKpi(records, dal, al) {
  const rs = filtraPerPeriodo(records, dal, al);
  const oggi = new Date().toLocaleDateString("it-IT");
  const periodo = dal||al ? `${dal?fmtPdfDate(dal):"inizio"} — ${al?fmtPdfDate(al):"oggi"}` : "Tutti i periodi";

  // aggregazioni
  const perMese={}, perProv={}, perViol={}, perAgente={}, perTipo={}, perStrada={};
  rs.forEach(r=>{
    if(r.data){ const [y,m]=r.data.split("-"); const k=`${y}-${m}`; perMese[k]=(perMese[k]||0)+1; }
    const provs=(r.provvedimenti||[]).filter(p=>p.tipo).map(p=>p.tipo);
    if(!provs.length&&r.provvedimento) provs.push(r.provvedimento);
    provs.forEach(p=>{ perProv[p]=(perProv[p]||0)+1; });
    (r.violazioniRiscontrate||[]).forEach(v=>{ const k=v.trim(); perViol[k]=(perViol[k]||0)+1; });
    const ags=(Array.isArray(r.agentiOp)&&r.agentiOp.length>0)?r.agentiOp:(r.agentiOp?r.agentiOp.split(",").map(s=>s.trim()).filter(Boolean):(r._agenti?r._agenti.split(",").map(s=>s.trim()).filter(Boolean):[r.creatoDA||""]));
    ags.forEach(a=>{ if(a) perAgente[a]=(perAgente[a]||0)+1; });
    const t=(r.tipo||"Non specificato").trim(); perTipo[t]=(perTipo[t]||0)+1;
    const via=(r.indirizzo||"—").replace(/\s+\d.*$/,"").trim(); perStrada[via]=(perStrada[via]||0)+1;
  });

  const mesiSorted=Object.entries(perMese).sort(([a],[b])=>a.localeCompare(b));
  const provList=Object.entries(perProv).sort(([,a],[,b])=>b-a);
  const violList=Object.entries(perViol).sort(([,a],[,b])=>b-a).slice(0,8);
  const agentiList=Object.entries(perAgente).sort(([,a],[,b])=>b-a).slice(0,8);
  const tipoList=Object.entries(perTipo).sort(([,a],[,b])=>b-a).slice(0,6);
  const stradaList=Object.entries(perStrada).sort(([,a],[,b])=>b-a).slice(0,8);
  const totViol=rs.reduce((s,r)=>s+(r.violazioniRiscontrate?.length||0),0);
  const conViol=rs.filter(r=>(r.violazioniRiscontrate||[]).length>0).length;
  const mesiLabel=k=>{ const [y,m]=k.split("-"); const n=["","Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"]; return `${n[parseInt(m)]} ${y}`; };
  const bar=(v,max,col="#1a3a6e")=>`<div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${Math.round(v/max*100)}%;background:${col}"></div></div><span style="font-size:7pt;font-weight:bold;color:${col}">${v}</span></div>`;

  const html=`<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/>
  <title>Totali e KPI</title><style>${CSS_BASE}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:4px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:4px}
  </style></head><body>
  <div class="hdr">
    <div><h1>📊 Totali e KPI — Controlli Commerciali</h1>
      <div style="font-size:8pt;color:#555;margin-top:3px">Periodo: ${periodo}</div>
    </div>
    <div class="hdr-r">U.O. San Lorenzo — Polizia Amministrativa<br/>Generato il ${oggi}</div>
  </div>

  <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr)">
    <div class="kpi"><div class="kpi-v">${rs.length}</div><div class="kpi-l">Totale controlli</div></div>
    <div class="kpi"><div class="kpi-v">${[...new Set(rs.map(r=>(r.nomeEsercizio||"").trim().toLowerCase()).filter(Boolean))].length}</div><div class="kpi-l">Esercizi unici</div></div>
    <div class="kpi"><div class="kpi-v" style="color:#c0392b">${totViol}</div><div class="kpi-l">Violazioni totali</div></div>
    <div class="kpi"><div class="kpi-v" style="color:#c0392b">${rs.length>0?Math.round(conViol/rs.length*100):0}%</div><div class="kpi-l">% con violazioni</div></div>
    <div class="kpi"><div class="kpi-v" style="color:#d4961a">${Object.keys(perStrada).length}</div><div class="kpi-l">Strade controllate</div></div>
  </div>

  <div class="sec-title">📅 Andamento mensile</div>
  <table><thead><tr><th>Mese</th><th>Controlli</th><th style="width:60%">Grafico</th></tr></thead><tbody>
    ${mesiSorted.map(([k,v])=>`<tr><td>${mesiLabel(k)}</td><td style="font-weight:bold;color:#1a3a6e">${v}</td><td>${bar(v,Math.max(...mesiSorted.map(([,x])=>x),1))}</td></tr>`).join("")}
  </tbody></table>

  <div class="two">
    <div>
      <div class="sec-title">⚖️ Provvedimenti adottati</div>
      <table><thead><tr><th>Provvedimento</th><th>N.</th><th>%</th></tr></thead><tbody>
        ${provList.map(([p,n])=>`<tr><td><span class="pill" style="background:${provColorPdf(p)}">${p}</span></td><td style="font-weight:bold">${n}</td><td style="color:#777">${Math.round(n/rs.length*100)}%</td></tr>`).join("")||`<tr><td colspan="3" style="color:#888">Nessun provvedimento</td></tr>`}
      </tbody></table>

      <div class="sec-title">🏷️ Tipo attività</div>
      <table><thead><tr><th>Tipo</th><th>N.</th><th style="width:50%">Grafico</th></tr></thead><tbody>
        ${tipoList.map(([t,n])=>`<tr><td>${t}</td><td style="font-weight:bold">${n}</td><td>${bar(n,tipoList[0][1],"#2471a3")}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div>
      <div class="sec-title">🚨 Top violazioni</div>
      <table><thead><tr><th>Violazione</th><th>N.</th><th style="width:40%">Grafico</th></tr></thead><tbody>
        ${violList.length>0?violList.map(([v,n])=>`<tr><td style="font-size:7.5pt">${v}</td><td style="font-weight:bold;color:#c0392b">${n}</td><td>${bar(n,violList[0][1],"#c0392b")}</td></tr>`).join(""):`<tr><td colspan="3" style="color:#888">Nessuna violazione</td></tr>`}
      </tbody></table>

      <div class="sec-title">👮 Agenti più attivi</div>
      <table><thead><tr><th>Agente</th><th>N.</th><th style="width:40%">Grafico</th></tr></thead><tbody>
        ${agentiList.map(([a,n])=>`<tr><td>${a}</td><td style="font-weight:bold">${n}</td><td>${bar(n,agentiList[0][1],"#7d3c98")}</td></tr>`).join("")}
      </tbody></table>
    </div>
  </div>

  <div class="sec-title">🗺️ Top strade per numero controlli</div>
  <table><thead><tr><th>Via / Indirizzo</th><th>Controlli</th><th style="width:55%">Grafico</th></tr></thead><tbody>
    ${stradaList.map(([v,n])=>`<tr><td>${v}</td><td style="font-weight:bold">${n}</td><td>${bar(n,stradaList[0][1])}</td></tr>`).join("")}
  </tbody></table>

  <div class="footer">
    <span>Polizia Municipale di Napoli — U.O. San Lorenzo</span>
    <span>Generato il ${oggi}</span>
  </div>
  <script>window.onload=function(){window.print()};<\/script>
  </body></html>`;
  apriPdf(html);
}

const BACKUP_KEY = "pm-ultimo-backup";

function DaFareModal({records, vocabolario, onClose, onApri}){
  const [tab,setTab]=useState("incompleti");
  const oggi=new Date();

  const pulisci = a => (a||[]).filter(v=>v&&!v.toLowerCase().startsWith("nessun"));
  const provsDi = r => { const p=(r.provvedimenti||[]).filter(x=>x&&x.tipo).map(x=>x.tipo); if(!p.length&&r.provvedimento) p.push(r.provvedimento); return p; };

  // 1. Record incompleti
  const incompleti = React.useMemo(()=>records.map(r=>{
    const manca=[];
    if(!r.indirizzo)                     manca.push("indirizzo");
    if(!r.legaleRappresentante&&!r.titolare) manca.push("legale rapp.");
    if(!r.tipoAttivita)                  manca.push("tipo attività");
    if(!provsDi(r).length)               manca.push("provvedimento");
    if(!(r.agentiOp?.length)&&!r._agenti) manca.push("agenti");
    return manca.length?{r,manca}:null;
  }).filter(Boolean).sort((a,b)=>b.manca.length-a.manca.length),[records]);

  // 2. Violazioni fuori vocabolario
  const fuoriVocab = React.useMemo(()=>{
    const vl=vocabolario.map(v=>v.toLowerCase());
    const m={};
    records.forEach(r=>pulisci(r.violazioniRiscontrate).forEach(v=>{
      if(!vl.includes(v.toLowerCase())){
        if(!m[v]) m[v]={voce:v,n:0,esempi:[]};
        m[v].n++; if(m[v].esempi.length<3) m[v].esempi.push(r.nomeEsercizio||"—");
      }
    }));
    return Object.values(m).sort((a,b)=>b.n-a.n);
  },[records,vocabolario]);

  // 3. Esercizi non controllati da tempo
  const daRicontrollare = React.useMemo(()=>{
    const m={};
    records.forEach(r=>{
      const k=(r.nomeEsercizio||"").trim(); if(!k) return;

      if(!m[kl]||(r.data||"")>(m[kl].data||"")) m[kl]={nome:k,data:r.data,indirizzo:r.indirizzo,r};

    return Object.values(m).map(e=>{
      const d=e.data?new Date(e.data):null;

    exportJSON(records, `BACKUP_registro_${toLocalISO(oggi)}.json`);

    setFatto(true);
  };

  const TABS=[

// Raggruppa i titoli autorizzativi che condividono la stessa parte numerica:
// ["SCIA Somministrazione: 12345/2024","SCIA Sanitaria: 12345/2024"] → ["SCIA UNICA 12345/2024"]
function normalizzaSCIAUnica(titoli){
  if(!titoli || titoli.length<=1) return [...(titoli||[])];
  const getNum = t => {
    const i = t.indexOf(":");
    if(i !== -1){
      const p = t.slice(i+1).trim();
      const m = p.match(/[A-Z0-9][A-Z0-9\/\-\.]*/i);
      return m ? m[0].toUpperCase().trim() : (p.toUpperCase().trim() || null);
    }
    const m = t.match(/\d[\d\/\-\.]*/);
    return m ? m[0] : null;
  };
  const conteggi = {};
  titoli.forEach(t=>{ const n=getNum(t); if(n!==null) conteggi[n]=(conteggi[n]||0)+1; });
  const out=[], visti=new Set();
  titoli.forEach(t=>{
    const n=getNum(t);
    if(n===null){ out.push(t); return; }
    if(visti.has(n)) return;
    visti.add(n);
    out.push(conteggi[n]>1 ? `SCIA UNICA ${n}` : t);
  });
  return out;
}

function AggiungiTitoloInline({onAdd}){
  const [v,setV]=useState("");
  const conferma=()=>{ if(v.trim()){ onAdd(v.trim()); setV(""); } };
  return (
    <div style={{display:"flex",gap:5,marginTop:2}}>
      <input value={v} onChange={e=>setV(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); conferma(); } }}
        placeholder="Aggiungi titolo… (Invio)"
        style={{...INP,fontSize:11,padding:"5px 8px",flex:1}}/>
      <button onClick={conferma} className="btn-glass"
        style={{fontSize:11,padding:"5px 11px",color:"var(--accent)",flexShrink:0}}>+</button>
    </div>
  );
}

function CommercialeCorrectorModal({records, db, operatore, onClose}){
  const costruisci = r => {
    const orig = r.titoliAutorizzativi || [];
    const norm = normalizzaSCIAUnica(orig);
    const ragVuota = !(r.ragioneSociale && r.ragioneSociale.trim());
    const haUnica  = norm.some(t => t.startsWith("SCIA UNICA"));
    const cambia   = haUnica || ragVuota;
    return { id:r.id, original:r, orig, norm,
             ragioneSociale: ragVuota ? "Ditta Individuale" : r.ragioneSociale,
             ragVuota, haUnica, cambia, _sel: cambia };
  };

  const [corr,setCorr]     = useState(()=>records.map(costruisci));
  const [aperto,setAperto] = useState(null);
  const [inCorso,setInCorso]= useState(false);
  const [fatto,setFatto]   = useState(false);
  const [avanz,setAvanz]   = useState(0);

  const setC = (i,k,v) => setCorr(p=>{ const n=[...p]; n[i]={...n[i],[k]:v}; return n; });
  const nSel     = corr.filter(c=>c._sel).length;
  const nCambi   = corr.filter(c=>c.cambia).length;

  const applica = async () => {
    const da = corr.filter(c=>c._sel);
    if(!da.length || !db) return;
    setInCorso(true);
    const ora = firebase.firestore.FieldValue.serverTimestamp();
    let n=0;
    for(let i=0;i<da.length;i+=450){
      const batch = db.batch();
      da.slice(i,i+450).forEach(c=>{
        batch.update(db.collection(COLL).doc(c.id), {
          titoliAutorizzativi: c.norm,
          ragioneSociale: c.ragioneSociale,
          modificatoDa: operatore?.nome || "—",
          modificatoIl: ora,
        });
      });
      await batch.commit();
      n += Math.min(450, da.length-i);
      setAvanz(n);
    }
    try{
      await db.collection(COLL_LOG).add({
        azione:"modifica",
        dettaglio:`Correzione dati commerciali: ${n} record (SCIA UNICA + Ragione Sociale)`,
        operatore:operatore?.nome||"—", matricola:operatore?.matricola||"", timestamp:ora,
      });
    }catch(_){}
    setFatto(true); setInCorso(false);
  };

  if(fatto) return (
    <Overlay>
      <div className="overlay-modal" style={{background:"rgba(10,14,22,.9)",border:"0.5px solid rgba(82,214,138,.3)",backdropFilter:"blur(40px)",borderRadius:"var(--radius-lg)",width:"100%",maxWidth:500,padding:34,textAlign:"center",boxShadow:"0 20px 60px rgba(0,0,0,.7)"}}>
        <div style={{fontSize:50,marginBottom:14}}>✅</div>
        <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:22,fontWeight:700,marginBottom:8}}>Correzione completata</div>
        <div style={{fontSize:14,color:"var(--text-2)",marginBottom:24}}>{avanz} record aggiornati.</div>
        <button onClick={onClose} className="btn-primary" style={{padding:"11px 30px"}}>Chiudi</button>
      </div>
    </Overlay>
  );

    <Overlay>
      <div className="overlay-modal" style={{background:"rgba(10,14,22,.9)",border:"0.5px solid rgba(255,255,255,.14)",backdropFilter:"blur(40px)",borderRadius:"var(--radius-lg)",width:"100%",maxWidth:920,padding:0,maxHeight:"94vh",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,.7)"}}>

        <div style={{padding:"22px 24px 0",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
            <div>
              <div style={{fontFamily:"'Crimson Pro',Georgia,serif",fontSize:21,fontWeight:700}}>🏪 Correttore Attività Commerciali</div>
              <div style={{fontSize:12,color:"var(--text-3)",marginTop:4}}>
                <b style={{color:"var(--blue)"}}>{records.length}</b> record · <b style={{color:"var(--orange)"}}>{nCambi}</b> correggibili · <b style={{color:"var(--accent)"}}>{nSel}</b> selezionati
              </div>
            </div>
            <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-3)",cursor:"pointer",fontSize:22,lineHeight:1}}>×</button>
          </div>

          <div style={{background:"rgba(255,255,255,.03)",border:"0.5px solid rgba(255,255,255,.07)",borderRadius:9,padding:"12px 16px",marginBottom:14,fontSize:11.5,lineHeight:1.9}}>
            <div style={{fontSize:9.5,color:"var(--blue)",letterSpacing:".08em",textTransform:"uppercase",fontWeight:600,marginBottom:4}}>Cosa viene corretto</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"2px 24px",color:"var(--text-3)"}}>
              <div>Titoli con <b style={{color:"var(--text-1)"}}>stessa numerazione</b> <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--purple)",fontWeight:700}}>SCIA UNICA {"{numero}"}</span></div>
              <div>Ragione Sociale <b style={{color:"var(--text-1)"}}>vuota</b> <span style={{color:"var(--red)"}}>→</span> <span style={{color:"var(--green)",fontWeight:700}}>"Ditta Individuale"</span></div>
            </div>
          </div>

          <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
            <button onClick={()=>setCorr(p=>p.map(c=>({...c,_sel:c.cambia})))} className="btn-glass" style={{fontSize:11,padding:"5px 12px",color:"var(--blue)"}}>☑ Solo modificati ({nCambi})</button>

                      <input type="checkbox" checked={c._sel} onChange={()=>setC(i,"_sel",!c._sel)} onClick={e=>e.stopPropagation()}

                      <div style={{flex:1,minWidth:0}}>

                    {ap && (
                      <div style={{padding:"0 14px 14px",borderTop:"0.5px solid rgba(255,255,255,.06)"}}>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,paddingTop:14}}>
                          <div>
                            <div style={{fontSize:9.5,color:"var(--red)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:10,fontWeight:600}}>📌 Dati originali</div>
                            <div style={{fontSize:12,color:"var(--text-3)",lineHeight:2}}>
                              <div>Ragione Sociale: <b style={{color:"var(--text-1)"}}>{c.original.ragioneSociale||<i style={{color:"var(--red)"}}>vuota</i>}</b></div>
                              <div style={{marginTop:4}}>Titoli ({c.orig.length}):</div>
                              {c.orig.length===0
                                ? <div style={{color:"var(--text-3)",fontStyle:"italic",paddingLeft:8}}>nessuno</div>
                                : c.orig.map((t,k)=>(
                                    <div key={k} style={{background:"rgba(255,255,255,.05)",borderRadius:6,padding:"3px 9px",margin:"2px 0",fontSize:11,color:"var(--blue)"}}>
                                      <span style={{color:"var(--text-3)",fontSize:10}}>{k+1}.</span> {t}
                                    </div>))}
                            </div>
                          </div>
                          <div>
                            <div style={{fontSize:9.5,color:"var(--green)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:10,fontWeight:600}}>✅ Valori corretti</div>
                            <div style={{display:"flex",flexDirection:"column",gap:10}}>
                              <Field label="Ragione Sociale">
                                <input style={{...INP,fontSize:12,padding:"6px 9px"}} value={c.ragioneSociale}
                                  onChange={e=>setC(i,"ragioneSociale",e.target.value)}/>
                              </Field>
                              <Field label="Titoli autorizzativi">
                                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                                  {c.norm.length===0
                                    ? <span style={{fontSize:12,color:"var(--text-3)",fontStyle:"italic"}}>nessuno</span>
                                    : c.norm.map((t,k)=>{
                                        const u=t.startsWith("SCIA UNICA");
                                        return (
                                          <div key={k} style={{display:"flex",gap:6,alignItems:"center"}}>
                                            <div style={{flex:1,background:u?"rgba(176,122,247,.12)":"rgba(126,184,247,.1)",border:`0.5px solid ${u?"rgba(176,122,247,.3)":"rgba(126,184,247,.25)"}`,borderRadius:7,padding:"4px 10px",fontSize:12,color:u?"var(--purple)":"var(--blue)",fontWeight:u?700:400}}>
                                              {u?"🔗 ":""}{t}
                                            </div>
                                            <button onClick={()=>setC(i,"norm",c.norm.filter((_,z)=>z!==k))} title="Rimuovi"
                                              style={{background:"none",border:"0.5px solid rgba(255,112,112,.3)",color:"var(--red)",fontSize:13,width:26,height:26,borderRadius:6,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
                                          </div>);
                                      })}
                                  <AggiungiTitoloInline onAdd={t=>setC(i,"norm",[...c.norm,t])}/>
                                  {c.orig.length>0 && (
                                    <button onClick={()=>setC(i,"norm",normalizzaSCIAUnica(c.orig))} className="btn-glass"
                                      style={{fontSize:11,padding:"5px 11px",color:"var(--purple)",borderColor:"rgba(176,122,247,.3)",marginTop:2,alignSelf:"flex-start"}}>
                                      🔄 Ricalcola da originali
                                    </button>)}
                                </div>
                              </Field>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>);
              })}
        </div>

        <div style={{padding:"14px 24px",borderTop:"0.5px solid rgba(255,255,255,.08)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,gap:8,flexWrap:"wrap"}}>
          <div style={{fontSize:12,color:"var(--text-3)"}}>
            {nSel>0 && <>Verranno aggiornati <b style={{color:"var(--blue)"}}>{nSel}</b> record</>}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={onClose} className="btn-glass" style={{fontSize:13}}>Annulla</button>
            <button disabled={nSel===0||inCorso} onClick={applica} className="btn-primary" style={{fontSize:13,opacity:nSel?1:.4}}>
              {inCorso ? `⏳ Correzione… (${avanz}/${nSel})` : `🏪 Correggi ${nSel} record`}
            </button>
          </div>
        </div>
      </div>
    </Overlay>
  );
}
